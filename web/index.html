<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F6B47">
<title>Rasoi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,750&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone = one column; tablet/desktop (>=900px) = kitchen panel left, suggestion right.
   Coriander green leads; haldi marks favourites. */
:root{
  --bg:#F3F5F1; --surface:#FFFFFF; --sunk:#E9EEE6; --ink:#16201A; --ink-2:#4B5A51; --ink-3:#77857C;
  --line:#DCE3D9; --line-strong:#B2BFB4;
  --leaf:#1F6B47; --leaf-ink:#165A3A; --leaf-soft:#E0EFE6; --on-leaf:#FFFFFF;
  --haldi:#E2A21B; --haldi-soft:#FBF0D5; --haldi-ink:#845600;
  --danger:#B23A2E; --danger-soft:#F8E3E0;
  --shadow:0 1px 2px rgba(22,32,26,.06), 0 8px 24px rgba(22,32,26,.06);
  --shadow-lg:0 -8px 40px rgba(22,32,26,.18);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --r:16px; --r-sm:11px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1411; --surface:#171E1A; --sunk:#202923; --ink:#E6ECE7; --ink-2:#A9B6AE; --ink-3:#7E8C84;
  --line:#28322C; --line-strong:#45534B;
  --leaf:#4CBF86; --leaf-ink:#7AD6A6; --leaf-soft:#163426; --on-leaf:#0A1A11;
  --haldi:#EDB443; --haldi-soft:#2F2611; --haldi-ink:#F2C46A;
  --danger:#F08A7E; --danger-soft:#3A1D19;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 -8px 40px rgba(0,0,0,.5); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0F1411; --surface:#171E1A; --sunk:#202923; --ink:#E6ECE7; --ink-2:#A9B6AE; --ink-3:#7E8C84;
  --line:#28322C; --line-strong:#45534B;
  --leaf:#4CBF86; --leaf-ink:#7AD6A6; --leaf-soft:#163426; --on-leaf:#0A1A11;
  --haldi:#EDB443; --haldi-soft:#2F2611; --haldi-ink:#F2C46A;
  --danger:#F08A7E; --danger-soft:#3A1D19;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 -8px 40px rgba(0,0,0,.5); color-scheme:dark;}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--leaf); outline-offset:2px; border-radius:8px}
[hidden]{display:none !important}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
.wrap{max-width:1080px; margin:0 auto; padding-inline:16px; padding-block:0 72px}
@media (min-width:700px){.wrap{padding-inline:28px}}

/* ---------- header ---------- */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-bottom:1px solid var(--line)}
.top-in{max-width:1080px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:8px}
@media (min-width:700px){.top-in{padding:12px 28px}}
.logo{display:flex; align-items:center; gap:10px; flex:1; min-width:0; text-decoration:none; color:var(--ink)}
.logo-mark{width:36px; height:36px; border-radius:11px; background:var(--leaf); display:grid; place-items:center; color:var(--on-leaf); flex:none}
.logo b{font-family:var(--f-display); font-weight:750; font-size:1.3rem; letter-spacing:-.02em}
.icon-btn{position:relative; width:44px; height:44px; display:grid; place-items:center; border-radius:13px; border:1px solid var(--line); background:var(--surface); color:var(--ink-2); text-decoration:none; transition:border-color .15s, color .15s}
.icon-btn:hover{border-color:var(--line-strong); color:var(--ink)}
.icon-btn.on{border-color:var(--leaf); color:var(--leaf-ink); background:var(--leaf-soft)}
.icon-btn .lbl{display:none}
@media (min-width:900px){.icon-btn{width:auto; padding:0 14px; grid-auto-flow:column; gap:8px; font-weight:600; font-size:.92rem}.icon-btn .lbl{display:inline}}
.badge{position:absolute; top:-7px; right:-7px; min-width:21px; height:21px; padding:0 6px; border-radius:99px; background:var(--leaf); color:var(--on-leaf); font-size:.72rem; font-weight:700; display:grid; place-items:center; font-variant-numeric:tabular-nums; border:2px solid var(--bg)}
.badge.fav{background:var(--haldi); color:#2A1C00}
.badge:empty{display:none}

/* ---------- type ---------- */
h1,h2,h3{font-family:var(--f-display); letter-spacing:-.02em; margin:0; text-wrap:balance}
h1{font-size:clamp(1.6rem, 4vw, 2.1rem); font-weight:750; line-height:1.1}
h2{font-size:1.22rem; font-weight:650; line-height:1.25}
h3{font-size:1.2rem; font-weight:650; line-height:1.25}
.muted{color:var(--ink-2)} .small{font-size:.86rem} .tiny{font-size:.78rem}
.label{font-family:var(--f-display); font-size:.72rem; font-weight:650; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3)}
p{margin:0}

/* ---------- layout pieces ---------- */
.hello{padding-block:24px 18px; display:flex; flex-direction:column; gap:6px}
.home-grid{display:grid; gap:16px; align-items:start}
@media (min-width:900px){.home-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:24px}.home-grid .col-right{position:sticky; top:84px}}
.stack{display:flex; flex-direction:column; gap:14px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:18px; box-shadow:var(--shadow)}
.card-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px}
.page-head{display:flex; align-items:center; gap:12px; padding-block:22px 16px}
.back{width:42px; height:42px; border-radius:12px; border:1px solid var(--line); background:var(--surface); display:grid; place-items:center; flex:none; color:var(--ink)}
.narrow{max-width:760px; margin-inline:auto}

/* ---------- buttons & inputs ---------- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:10px 16px; border-radius:12px; border:1px solid var(--line-strong); background:var(--surface); font-weight:600; text-decoration:none; color:var(--ink); transition:transform .1s, border-color .15s, background .15s}
.btn:hover{border-color:var(--ink-2)}
.btn:active{transform:scale(.98)}
.btn.solid{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.btn.leaf{background:var(--leaf); color:var(--on-leaf); border-color:var(--leaf)}
.btn.soft{background:var(--leaf-soft); color:var(--leaf-ink); border-color:transparent}
.btn.ghost{background:transparent; border-color:transparent; color:var(--ink-2)}
.btn.danger{color:var(--danger); border-color:var(--danger); background:var(--surface)}
.btn.block{width:100%}
.btn:disabled{opacity:.45; cursor:not-allowed; transform:none}
.btn.big{min-height:58px; font-family:var(--f-display); font-size:1.2rem; font-weight:750; border-radius:15px}
.input{width:100%; min-width:0; min-height:48px; padding:12px 14px; border-radius:12px; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink)}
.input::placeholder{color:var(--ink-3)}
.input:focus{outline:none; border-color:var(--leaf); box-shadow:0 0 0 3px var(--leaf-soft)}
.field{display:flex; flex-direction:column; gap:6px; min-width:0}
.field > label{font-size:.86rem; font-weight:600; color:var(--ink-2)}
.err-text{color:var(--danger); font-size:.85rem; font-weight:600}

.seg{display:grid; grid-auto-columns:1fr; grid-auto-flow:column; background:var(--sunk); border-radius:13px; padding:4px; gap:4px}
.seg button{border:0; background:transparent; min-height:42px; padding:8px 6px; border-radius:10px; font-weight:600; color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.1)}

.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{display:inline-flex; align-items:center; gap:6px; min-height:34px; padding:6px 12px; border-radius:99px; border:1px solid var(--line-strong); background:var(--surface); font-size:.88rem; font-weight:500}
.chip.use{background:var(--leaf-soft); border-color:transparent; color:var(--leaf-ink); min-height:28px; padding:3px 10px; font-size:.82rem; font-weight:600}
.chip .x{border:0; background:none; padding:0 0 0 2px; color:var(--ink-3); font-size:1.1rem; line-height:1; min-width:20px}

/* ---------- combobox ---------- */
.combo{position:relative}
.combo-input{padding-left:44px}
.combo-icon{position:absolute; left:14px; top:14px; color:var(--ink-3); pointer-events:none}
.combo-list{position:absolute; z-index:15; left:0; right:0; top:calc(100% + 6px); background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:0 12px 40px rgba(0,0,0,.14); max-height:min(360px, 55vh); overflow-y:auto; padding:6px; margin:0; list-style:none}
.opt{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; cursor:pointer; min-height:48px}
.opt[aria-selected="true"], .opt:hover{background:var(--sunk)}
.opt .o-main{flex:1; min-width:0}
.opt .o-name{font-weight:600}
.opt .o-name mark{background:none; color:var(--leaf-ink); text-decoration:underline; text-underline-offset:3px}
.opt .o-sub{font-size:.8rem; color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.opt .o-have{font-size:.75rem; font-weight:700; color:var(--leaf-ink); background:var(--leaf-soft); padding:3px 8px; border-radius:99px; white-space:nowrap}
.opt.custom .o-name{color:var(--leaf-ink)}
.combo-empty{padding:14px; color:var(--ink-2); font-size:.9rem}

/* selected item panel */
.picked{margin-top:12px; border:1.5px solid var(--leaf); background:var(--leaf-soft); border-radius:14px; padding:14px; display:flex; flex-direction:column; gap:12px}
.picked-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
.picked-top b{font-family:var(--f-display); font-size:1.15rem}
.qty-row{display:flex; flex-wrap:wrap; gap:10px; align-items:center}
.stepper{display:inline-flex; align-items:center; border:1px solid var(--line-strong); border-radius:12px; background:var(--surface); overflow:hidden}
.stepper button{width:44px; height:44px; border:0; background:none; font-size:1.25rem; font-weight:600; color:var(--ink)}
.stepper button:hover{background:var(--sunk)}
.stepper input{width:64px; height:44px; border:0; text-align:center; background:transparent; font-weight:600; font-variant-numeric:tabular-nums; -moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none}
.units{display:flex; flex-wrap:wrap; gap:6px}
.unit{min-height:40px; min-width:48px; padding:6px 12px; border-radius:10px; border:1px solid var(--line-strong); background:var(--surface); font-weight:600; font-size:.88rem}
.unit[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}

.or-row{display:flex; align-items:center; gap:10px; margin:14px 0 12px; color:var(--ink-3); font-size:.8rem}
.or-row::before,.or-row::after{content:""; flex:1; height:1px; background:var(--line)}
.browse-row{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.browse-row .btn{white-space:nowrap}
@media (max-width:360px){.browse-row{grid-template-columns:1fr}}

/* ---------- bottom sheet / modal ---------- */
.scrim{position:fixed; inset:0; background:rgba(10,15,12,.45); z-index:40; opacity:0; transition:opacity .2s}
.scrim.show{opacity:1}
.sheet{position:fixed; z-index:41; left:0; right:0; bottom:0; max-height:88vh; background:var(--surface); border-radius:22px 22px 0 0; box-shadow:var(--shadow-lg); display:flex; flex-direction:column; transform:translateY(100%); transition:transform .25s ease; padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.show{transform:none}
@media (min-width:700px){.sheet{left:50%; right:auto; bottom:auto; top:50%; width:min(760px, 92vw); max-height:84vh; border-radius:22px; transform:translate(-50%,-46%); opacity:0; transition:all .2s ease}.sheet.show{transform:translate(-50%,-50%); opacity:1}}
.grab{width:42px; height:5px; border-radius:99px; background:var(--line-strong); margin:10px auto 0}
@media (min-width:700px){.grab{display:none}}
.sheet-head{padding:14px 18px 10px; display:flex; flex-direction:column; gap:12px; border-bottom:1px solid var(--line)}
.sheet-title{display:flex; align-items:center; justify-content:space-between; gap:10px}
.tabs{display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px; margin:0 -18px; padding-inline:18px; scroll-snap-type:x proximity}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none; min-height:38px; padding:7px 14px; border-radius:99px; border:1px solid var(--line-strong); background:var(--surface); font-weight:600; font-size:.88rem; color:var(--ink-2); scroll-snap-align:start; white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.tab .n{opacity:.7; font-weight:500; margin-left:4px; font-variant-numeric:tabular-nums}
.sheet-body{overflow-y:auto; padding:16px 18px; flex:1; -webkit-overflow-scrolling:touch}
.pack{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px; border-radius:14px; background:var(--haldi-soft); border:1px solid color-mix(in srgb, var(--haldi) 50%, transparent); margin-bottom:16px}
.pack b{font-family:var(--f-display)}
.pack .btn{white-space:nowrap; flex:none}
@media (max-width:460px){.pack{flex-direction:column; align-items:stretch}}
body.sheet-open .toast{bottom:calc(88px + env(safe-area-inset-bottom,0px))}
.card-head .btn{white-space:nowrap}
.tiles{display:grid; grid-template-columns:repeat(auto-fill, minmax(min(150px, 44%), 1fr)); gap:10px}
.tile{position:relative; text-align:left; min-height:68px; padding:12px 40px 12px 14px; border-radius:14px; border:1.5px solid var(--line); background:var(--surface); display:flex; flex-direction:column; justify-content:center; gap:2px; transition:border-color .15s, background .15s}
.tile:hover{border-color:var(--line-strong)}
.tile .t-name{font-weight:600; line-height:1.25}
.tile .t-alias{font-size:.76rem; color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tile .t-mark{position:absolute; right:12px; top:50%; transform:translateY(-50%); width:24px; height:24px; border-radius:50%; border:1.5px solid var(--line-strong); display:grid; place-items:center; font-size:.95rem; font-weight:700; color:var(--ink-3)}
.tile[aria-pressed="true"]{border-color:var(--leaf); background:var(--leaf-soft)}
.tile[aria-pressed="true"] .t-mark{background:var(--leaf); border-color:var(--leaf); color:var(--on-leaf)}
.sheet-foot{padding:12px 18px; border-top:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:12px}

/* ---------- results ---------- */
.meal{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:18px; display:flex; flex-direction:column; gap:12px; box-shadow:var(--shadow)}
.meal-top{display:flex; justify-content:space-between; gap:12px; align-items:flex-start}
.slot{font-family:var(--f-display); font-size:.72rem; font-weight:750; letter-spacing:.09em; text-transform:uppercase; color:var(--leaf-ink)}
.mins{flex:none; display:inline-flex; align-items:center; gap:5px; font-size:.82rem; font-weight:600; color:var(--ink-2); background:var(--sunk); padding:5px 10px; border-radius:99px; font-variant-numeric:tabular-nums}
.why{color:var(--ink-2)}
.meal-actions{display:flex; gap:8px; border-top:1px solid var(--line); padding-top:12px; align-items:center}
.meal-actions .spacer{flex:1}
.act{display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:42px; min-width:42px; border:1px solid var(--line); background:var(--surface); padding:8px 12px; border-radius:12px; font-size:.88rem; font-weight:600; color:var(--ink-2)}
.act:hover{border-color:var(--line-strong)}
.act[aria-pressed="true"].heart{background:var(--haldi-soft); border-color:var(--haldi); color:var(--haldi-ink)}
.act[aria-pressed="true"].up{background:var(--leaf-soft); border-color:var(--leaf); color:var(--leaf-ink)}
.act[aria-pressed="true"].down{background:var(--danger-soft); border-color:var(--danger); color:var(--danger)}
.act[aria-pressed="true"] svg{fill:currentColor}
.empty{text-align:center; padding:36px 20px; border:1.5px dashed var(--line-strong); border-radius:var(--r); color:var(--ink-2); display:flex; flex-direction:column; align-items:center; gap:10px}
.empty h2{color:var(--ink)}
.notice{border-radius:var(--r); padding:16px; border:1px solid; display:flex; flex-direction:column; gap:10px}
.notice.warn{background:var(--haldi-soft); border-color:var(--haldi)}
.notice.err{background:var(--danger-soft); border-color:var(--danger)}
.placeholder{border:1.5px dashed var(--line-strong); border-radius:var(--r); padding:26px 20px; text-align:center; color:var(--ink-2)}
.skel{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:18px; display:flex; flex-direction:column; gap:12px}
.skel i{display:block; height:12px; border-radius:6px; background:var(--sunk)}
@media (prefers-reduced-motion:no-preference){.skel i{animation:pulse 1.2s ease-in-out infinite}}
@keyframes pulse{50%{opacity:.45}}

/* ---------- kitchen list ---------- */
.group-h{display:flex; justify-content:space-between; align-items:baseline; margin:6px 4px 8px}
.rows{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
.row{display:grid; grid-template-columns:minmax(0,1fr) auto auto 44px; gap:10px; align-items:center; padding:10px 12px 10px 16px; border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .r-name{font-weight:600; overflow-wrap:anywhere}
.row .r-sub{display:block; font-size:.76rem; color:var(--ink-3); font-weight:400}
.row .r-qty{width:84px; min-height:42px; padding:8px 10px; text-align:center}
.row select{min-height:42px; padding:8px 10px; border-radius:11px; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); font-weight:600}
.del{width:44px; height:44px; border-radius:12px; border:1px solid transparent; background:none; color:var(--ink-3); display:grid; place-items:center}
.del:hover{color:var(--danger); background:var(--danger-soft)}
@media (max-width:520px){
  .row{grid-template-columns:minmax(0,1fr) 60px 74px 38px; gap:6px; padding:8px 8px 8px 14px}
  .row .r-qty{width:60px; padding:6px; min-height:40px} .row select{padding:6px; min-height:40px} .del{width:38px; height:38px}
}
@media (max-width:340px){
  .row{grid-template-columns:minmax(0,1fr) 44px; grid-template-areas:"name del" "qty qty"; row-gap:8px}
  .row .r-name{grid-area:name} .row .del{grid-area:del}
  .row .r-ctl{grid-area:qty; display:flex; gap:8px}
  .row .r-qty{flex:1; width:auto}
}
@media (min-width:341px){.row .r-ctl{display:contents}}

/* favourites */
.fav-grid{display:grid; gap:14px}
@media (min-width:700px){.fav-grid{grid-template-columns:1fr 1fr}}
.status{display:inline-flex; align-items:center; gap:6px; font-size:.82rem; font-weight:600; padding:4px 10px; border-radius:99px; width:max-content; max-width:100%}
.status.ok{background:var(--leaf-soft); color:var(--leaf-ink)}
.status.no{background:var(--sunk); color:var(--ink-2)}

/* ---------- auth ---------- */
.auth{min-height:100vh; display:grid; place-items:center; padding:28px 16px}
.auth-box{width:min(440px, 100%); display:flex; flex-direction:column; gap:22px}
.auth-box h1{font-size:clamp(1.9rem, 6vw, 2.4rem)}
.pw{position:relative}
.pw .input{padding-right:72px}
.pw button{position:absolute; right:6px; top:6px; height:36px; padding:0 12px; border:0; background:var(--sunk); border-radius:9px; font-size:.8rem; font-weight:700; color:var(--ink-2)}
.meter{height:5px; border-radius:99px; background:var(--sunk); overflow:hidden}
.meter i{display:block; height:100%; width:0; transition:width .2s, background .2s}
.switch-auth{text-align:center; color:var(--ink-2)}
.switch-auth a{color:var(--leaf-ink); font-weight:700}
.demo-note{font-size:.8rem; color:var(--ink-3); text-align:center}

/* ---------- toast ---------- */
.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%) translateY(16px); background:var(--ink); color:var(--bg); padding:8px 8px 8px 16px; border-radius:14px; font-weight:600; font-size:.92rem; opacity:0; pointer-events:none; transition:all .2s; z-index:60; display:flex; align-items:center; gap:12px; max-width:calc(100vw - 32px); min-height:44px}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto}

<script>
/* =========================================================
   DIRECTORY
   ========================================================= */
const ING = window.INGREDIENTS;
const ING_BY_NAME = Object.fromEntries(ING.map(i => [i.name.toLowerCase(), i]));
const CATEGORIES = [...new Set(ING.map(i => i.category))];
const CUSTOM_UNITS = ['pcs','g','kg','ml','L','packet'];
const POPULAR = ['Onion','Tomato','Potato','Garlic','Ginger','Green chilli','Coriander leaves','Lemon','Rice','Atta','Toor dal','Moong dal','Besan','Poha','Sooji','Milk','Curd','Paneer','Eggs','Bread','Butter','Ghee','Peanuts','Green peas'];
const PACKS = [
  {name:'Everyday basics', items:['Onion','Tomato','Potato','Garlic','Ginger','Green chilli','Rice','Atta','Toor dal','Curd']},
  {name:'Breakfast shelf', items:['Poha','Sooji','Besan','Bread','Eggs','Milk','Butter','Peanuts']}
];
const DEFAULT_STAPLES = ['Salt','Sunflower oil','Water','Haldi','Jeera','Mustard seeds','Red chilli powder','Garam masala'];
const norm = s => String(s).toLowerCase().normalize('NFKD').replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();

function searchIngredients(q){
  const n = norm(q); if (!n) return [];
  const out = [];
  for (const i of ING){
    const name = norm(i.name); let score = 0, via = null;
    if (name === n) score = 120;
    else if (name.startsWith(n)) score = 100;
    else if (name.split(' ').some(w => w.startsWith(n))) score = 85;
    for (const a of i.aliases){
      const an = norm(a); let s = 0;
      if (an === n) s = 110; else if (an.startsWith(n)) s = 75; else if (an.split(' ').some(w => w.startsWith(n))) s = 65; else if (an.includes(n)) s = 35;
      if (s > score){ score = s; via = a; }
    }
    if (!score && name.includes(n)) score = 45;
    if (score) out.push({i, score, via});
  }
  return out.sort((a, b) => b.score - a.score || a.i.name.length - b.i.name.length || a.i.name.localeCompare(b.i.name));
}

/* =========================================================
   DB — Supabase. Everything is loaded into memory at log-in, so the UI
   reads instantly. Every change updates memory first, then saves to
   Supabase in order (a write queue), and shows a message if a save fails.
   ========================================================= */
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Math.random().toString(36).slice(2) + Date.now());
const sb = (window.supabase && window.RASOI_CONFIG && window.RASOI_CONFIG.url) ? window.supabase.createClient(window.RASOI_CONFIG.url, window.RASOI_CONFIG.key) : null;
const C = {user: null, ingredients: [], suggestions: [], favourites: [], ratings: []};
let writeQ = Promise.resolve();
function save(fn){
  writeQ = writeQ.then(fn).then(res => { if (res && res.error) throw res.error; }).catch(e => { console.error('save failed', e); toast("Couldn't save that change. Check your connection and try again."); });
  return writeQ;
}
const mealFromRow = m => ({id: m.id, slot: m.slot, dish: m.dish, minutes: m.minutes, uses: m.uses || [], why: m.why});
const DB = {
  async load(session){
    const id = session.user.id;
    const [p, st, ing, sug, fav, rat] = await Promise.all([
      sb.from('profiles').select('*').eq('id', id).maybeSingle(),
      sb.from('user_staples').select('name').eq('user_id', id),
      sb.from('user_ingredients').select('*').eq('user_id', id).order('created_at'),
      sb.from('suggestions').select('*, suggestion_meals(*)').eq('user_id', id).order('created_at', {ascending: false}).limit(30),
      sb.from('favourites').select('id, created_at, meal_id, suggestion_meals(*)').eq('user_id', id).order('created_at', {ascending: false}),
      sb.from('meal_ratings').select('meal_id, value').eq('user_id', id)
    ]);
    const err = [p, st, ing, sug, fav, rat].find(r => r.error); if (err) throw err.error;
    const prof = p.data || {id, name: (session.user.user_metadata || {}).name || session.user.email.split('@')[0], email: session.user.email, diet: 'veg'};
    C.user = {id, name: prof.name, email: prof.email || session.user.email, diet: prof.diet, staples: st.data.map(r => r.name)};
    C.ingredients = ing.data.map(r => ({id: r.id, catalog_id: r.catalog_id, name: r.name, category: r.category, quantity: r.quantity == null ? null : Number(r.quantity), unit: r.unit, created_at: r.created_at}));
    C.suggestions = sug.data.map(s => ({id: s.id, slot: s.slot, possible: s.possible, reason: s.reason, unlock: s.unlock_ingredient, nearest_dish: s.nearest_dish, nearest_missing: s.nearest_missing || [], created_at: s.created_at,
      meals: (s.suggestion_meals || []).sort((a, b) => a.slot.localeCompare(b.slot)).map(mealFromRow)}));
    C.favourites = fav.data.filter(f => f.suggestion_meals).map(f => ({id: f.id, meal_id: f.meal_id, created_at: f.created_at, ...mealFromRow(f.suggestion_meals), id: f.id}));
    C.ratings = rat.data;
  },
  // ---- auth ----
  currentUser(){ return C.user; },
  async signUp(name, email, pw){
    const {data, error} = await sb.auth.signUp({email, password: pw, options: {data: {name}, emailRedirectTo: location.origin}});
    if (error) throw new Error(/registered|exists/i.test(error.message) ? 'exists' : error.message);
    if (data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) throw new Error('exists');
    if (!data.session) return {confirm: true};
    await this.load(data.session); return {confirm: false};
  },
  async logIn(email, pw){
    const {data, error} = await sb.auth.signInWithPassword({email, password: pw});
    if (error) throw new Error(/confirm/i.test(error.message) ? 'unconfirmed' : /invalid/i.test(error.message) ? 'invalid' : error.message);
    await this.load(data.session);
  },
  async resetPassword(email){ const {error} = await sb.auth.resetPasswordForEmail(email, {redirectTo: location.origin}); if (error) throw error; },
  async setNewPassword(pw){ const {error} = await sb.auth.updateUser({password: pw}); if (error) throw error; },
  async signOut(){ await sb.auth.signOut(); Object.assign(C, {user: null, ingredients: [], suggestions: [], favourites: [], ratings: []}); },
  updateProfile(patch){
    const u = C.user; Object.assign(u, patch);
    if ('name' in patch || 'diet' in patch){ const row = {}; if ('name' in patch) row.name = patch.name; if ('diet' in patch) row.diet = patch.diet; save(() => sb.from('profiles').update(row).eq('id', u.id)); }
    if ('staples' in patch) save(async () => { const d = await sb.from('user_staples').delete().eq('user_id', u.id); if (d.error) return d; return patch.staples.length ? sb.from('user_staples').insert(patch.staples.map(name => ({user_id: u.id, name}))) : null; });
    return u;
  },
  // ---- ingredients ----
  ingredients(){ return C.ingredients; },
  has(name){ return C.ingredients.some(i => i.name.toLowerCase() === name.toLowerCase()); },
  _row(i){ return {id: i.id, user_id: C.user.id, catalog_id: i.catalog_id, name: i.name, category: i.category, quantity: i.quantity, unit: i.unit}; },
  addIngredient(name, qty, unit){
    const meta = ING_BY_NAME[name.toLowerCase()]; const allowed = meta ? meta.allowed_units : CUSTOM_UNITS;
    unit = allowed.includes(unit) ? unit : allowed[0];
    let row = C.ingredients.find(i => i.name.toLowerCase() === name.toLowerCase());
    if (row){
      if (qty != null && qty !== '') row.quantity = Number(qty); row.unit = unit;
      save(() => sb.from('user_ingredients').update({quantity: row.quantity, unit: row.unit, updated_at: new Date().toISOString()}).eq('id', row.id));
      return {row, updated: true};
    }
    row = {id: uid(), catalog_id: meta ? meta.id : null, name: meta ? meta.name : name.trim().replace(/^./, c => c.toUpperCase()), category: meta ? meta.category : 'Others', quantity: qty == null || qty === '' ? null : Number(qty), unit, created_at: new Date().toISOString()};
    C.ingredients.push(row); save(() => sb.from('user_ingredients').insert(this._row(row)));
    return {row, updated: false};
  },
  restoreIngredient(row){ if (this.has(row.name)) return; C.ingredients.push(row); save(() => sb.from('user_ingredients').insert(this._row(row))); },
  updateIngredient(id, patch){ const r = C.ingredients.find(i => i.id === id); if (!r) return; Object.assign(r, patch); save(() => sb.from('user_ingredients').update({...patch, updated_at: new Date().toISOString()}).eq('id', id)); },
  removeIngredient(id){ const row = C.ingredients.find(i => i.id === id); C.ingredients = C.ingredients.filter(i => i.id !== id); save(() => sb.from('user_ingredients').delete().eq('id', id)); return row; },
  removeByName(name){ const row = C.ingredients.find(i => i.name.toLowerCase() === name.toLowerCase()); if (row) this.removeIngredient(row.id); return row; },
  setIngredients(list){
    C.ingredients = list.slice();
    save(async () => { const d = await sb.from('user_ingredients').delete().eq('user_id', C.user.id); if (d.error || !list.length) return d; return sb.from('user_ingredients').insert(list.map(i => this._row(i))); });
  },
  // ---- suggestions ----
  suggestions(){ return C.suggestions; },
  lastSuggestion(){ return C.suggestions[0] || null; },
  saveSuggestion(s){
    C.suggestions.unshift(s); const u = s.usage || {}; delete s.raw_output_cache;
    save(async () => {
      const a = await sb.from('suggestions').insert({id: s.id, user_id: C.user.id, slot: s.slot, possible: s.possible, reason: s.reason || null, unlock_ingredient: s.unlock || null,
        ingredients_snapshot: s.ingredients_snapshot, model: u.model || 'unknown', prompt_version: u.prompt_version || 'v1', effort: u.effort || null, temperature: u.temperature ?? null,
        input_tokens: u.input_tokens, output_tokens: u.output_tokens, cost_usd: 0, latency_ms: u.latency_ms, stop_reason: u.stop_reason,
        raw_output: s.raw_output || null, grounding_dropped: s.grounding_dropped || [], nearest_dish: s.nearest_dish || null, nearest_missing: s.nearest_missing || []});
      if (a.error || !s.meals.length) return a;
      return sb.from('suggestion_meals').insert(s.meals.map(m => ({id: m.id, suggestion_id: s.id, user_id: C.user.id, slot: m.slot, dish: m.dish, why: m.why, minutes: m.minutes, uses: m.uses})));
    });
  },
  // ---- favourites ----
  favourites(){ return C.favourites; },
  isFavourite(mealId){ return C.favourites.some(f => f.meal_id === mealId); },
  toggleFavourite(meal){
    const f = C.favourites.find(x => x.meal_id === meal.id);
    if (f){ this.removeFavourite(f.id); return false; }
    const nf = {id: uid(), meal_id: meal.id, dish: meal.dish, slot: meal.slot, minutes: meal.minutes, uses: meal.uses, why: meal.why, created_at: new Date().toISOString()};
    C.favourites.unshift(nf); save(() => sb.from('favourites').insert({id: nf.id, user_id: C.user.id, meal_id: meal.id}));
    return true;
  },
  removeFavourite(id){ const f = C.favourites.find(x => x.id === id); C.favourites = C.favourites.filter(x => x.id !== id); save(() => sb.from('favourites').delete().eq('id', id)); return f; },
  restoreFavourite(f){ C.favourites.unshift(f); save(() => sb.from('favourites').insert({id: f.id, user_id: C.user.id, meal_id: f.meal_id})); },
  // ---- ratings ----
  rating(mealId){ const r = C.ratings.find(x => x.meal_id === mealId); return r ? r.value : 0; },
  rate(meal, value){
    C.ratings = C.ratings.filter(x => x.meal_id !== meal.id);
    if (value){ C.ratings.push({meal_id: meal.id, value}); save(() => sb.from('meal_ratings').upsert({user_id: C.user.id, meal_id: meal.id, value}, {onConflict: 'user_id,meal_id'})); }
    else save(() => sb.from('meal_ratings').delete().eq('user_id', C.user.id).eq('meal_id', meal.id));
  },
  deleteMyData(){
    const id = C.user.id; C.ingredients = []; C.suggestions = []; C.favourites = []; C.ratings = [];
    save(async () => { const a = await sb.from('user_ingredients').delete().eq('user_id', id); if (a.error) return a; return sb.from('suggestions').delete().eq('user_id', id); });
  }
};

/* =========================================================
   AI — mocked in the preview. Step 2 replaces suggest() with a
   call to our server function, which holds the Claude key.
   ========================================================= */
const AI = {
  // Calls the Supabase function "suggest". It reads this user's kitchen from the database,
  // calls Gemini with the secret key, checks the answer, picks one dish per meal, and saves it.
  async suggest({slot, avoid}){
    const {data, error} = await sb.functions.invoke('suggest', {body: {slot, avoid}});
    if (error){
      let msg = 'Something went wrong. Try again.';
      try { const j = await error.context.json(); if (j && j.error) msg = j.error; } catch(e){ if (/fetch|network/i.test(String(error.message))) msg = "Can't reach Rasoi. Check your internet connection."; }
      throw new Error(msg);
    }
    if (typeof data.remaining_today === 'number') ui.remaining = data.remaining_today;
    return {...data.suggestion, _saved: true};
  }
};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let toastT;
function toast(msg, action){
  const t = $('#toast'), b = $('#toast-act');
  $('#toast-msg').textContent = msg;
  b.hidden = !action; b.onclick = null;
  if (action){ b.textContent = action.label || 'Undo'; b.onclick = () => { action.run(); t.classList.remove('show'); }; }
  t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), action ? 4500 : 2000);
}

};

/* =========================================================
   AUTH — separate sign up and log in
   ========================================================= */
function authShell(inner){ $('#top').hidden = true; view.innerHTML = `<section class="auth"><div class="auth-box">
  <div class="logo"><span class="logo-mark" aria-hidden="true"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3.5 11h17a8.5 8.5 0 0 1-17 0Z"/><path d="M9 7.5c0-1.5 1-2 1-3.5M14 7.5c0-1.5 1-2 1-3.5"/></svg></span><b>Rasoi</b></div>${inner}</div></section>`; }
function pwField(id, label, auto){ return `<div class="field"><label for="${id}">${label}</label><div class="pw"><input class="input" id="${id}" type="password" autocomplete="${auto}" required minlength="8"><button type="button" data-showpw="${id}" aria-label="Show password">Show</button></div></div>`; }
function bindPw(){ view.querySelectorAll('[data-showpw]').forEach(b => b.addEventListener('click', () => { const i = $('#' + b.dataset.showpw); const show = i.type === 'password'; i.type = show ? 'text' : 'password'; b.textContent = show ? 'Hide' : 'Show'; b.setAttribute('aria-label', show ? 'Hide password' : 'Show password'); })); }

function renderSignup(){
  authShell(`<div class="stack" style="gap:8px"><h1>Create your account</h1><p class="muted">Tell Rasoi what's in your kitchen and it suggests what to cook, using only what you have.</p></div>
  <form class="card stack" id="f" novalidate>
    <div class="field"><label for="su-name">Your name</label><input class="input" id="su-name" autocomplete="given-name" required placeholder="Shubham"></div>
    <div class="field"><label for="su-email">Email</label><input class="input" id="su-email" type="email" autocomplete="email" required placeholder="you@example.com"></div>
    ${pwField('su-pw', 'Password', 'new-password')}
    <div class="meter" aria-hidden="true"><i id="meter"></i></div><p class="tiny muted" id="meter-text" style="margin-top:-8px">At least 8 characters.</p>
    ${pwField('su-pw2', 'Confirm password', 'new-password')}
    <p class="err-text" id="err" role="alert" hidden></p>
    <button class="btn leaf big block" type="submit">Create account</button>
  </form>
  <p class="switch-auth">Already have an account? <a href="#/login">Log in</a></p>`);
  bindPw();
  $('#su-pw').addEventListener('input', e => {
    const v = e.target.value; let s = 0; if (v.length >= 8) s++; if (/[A-Z]/.test(v) && /[a-z]/.test(v)) s++; if (/\d/.test(v)) s++; if (/[^A-Za-z0-9]/.test(v) || v.length >= 12) s++;
    const m = $('#meter'); m.style.width = (s / 4 * 100) + '%'; m.style.background = s < 2 ? 'var(--danger)' : s < 3 ? 'var(--haldi)' : 'var(--leaf)';
    $('#meter-text').textContent = v.length < 8 ? `At least 8 characters (${v.length}/8).` : ['Weak','Weak','Okay','Good','Strong'][s] + ' password.';
  });
  $('#f').addEventListener('submit', async e => {
    e.preventDefault(); const err = $('#err');
    const name = $('#su-name').value.trim(), email = $('#su-email').value.trim(), pw = $('#su-pw').value, pw2 = $('#su-pw2').value;
    const fail = m => { err.textContent = m; err.hidden = false; };
    if (!name) return fail('Enter your name.');
    if (!/^\S+@\S+\.\S+$/.test(email)) return fail('Enter a valid email address.');
    if (pw.length < 8) return fail('Use a password of at least 8 characters.');
    if (pw !== pw2) return fail("The two passwords don't match.");
    const btn = e.submitter || $('#f button[type=submit]'); btn.disabled = true; btn.textContent = 'Creating account…';
    try {
      const r = await DB.signUp(name, email, pw);
      if (r.confirm) return renderCheckEmail(email);
      location.hash = '#/'; route(); toast(`Welcome to Rasoi, ${name}`);
    } catch(x){
      btn.disabled = false; btn.textContent = 'Create account';
      if (x.message === 'exists'){ err.innerHTML = 'An account with this email already exists. <a href="#/login">Log in instead</a>.'; err.hidden = false; }
      else fail(x.message && x.message.length < 140 ? x.message : 'Something went wrong. Try again.');
    }
  });
}

/* =========================================================
   ADD PANEL — search + browse. Used on Home and My Kitchen.
   ========================================================= */
function addPanelHTML(p){
  return `<div class="combo" id="${p}-combo">
    <label class="sr" for="${p}-q">Search ingredients</label>
    <span class="combo-icon">${ICON.search}</span>
    <input class="input combo-input" id="${p}-q" role="combobox" aria-expanded="false" aria-controls="${p}-list" aria-autocomplete="list" autocomplete="off" placeholder="Search ${ING.length} ingredients, e.g. pyaz, dahi">
    <ul class="combo-list" id="${p}-list" role="listbox" hidden></ul>
  </div>
  <div id="${p}-picked"></div>
  <div class="or-row">or pick from the list</div>
  <div class="browse-row">
    <button class="btn" type="button" data-browse="Popular">${ICON.grid} Browse all</button>
    <button class="btn soft" type="button" data-pack="0">+ Everyday basics</button>
  </div>`;
}
function bindAddPanel(p, onChange){
  const q = $(`#${p}-q`), list = $(`#${p}-list`), picked = $(`#${p}-picked`);
  let results = [], active = -1;
  const close = () => { list.hidden = true; q.setAttribute('aria-expanded', 'false'); active = -1; };
  const hl = (name, query) => { const i = name.toLowerCase().indexOf(query.toLowerCase()); return i < 0 ? esc(name) : esc(name.slice(0, i)) + '<mark>' + esc(name.slice(i, i + query.length)) + '</mark>' + esc(name.slice(i + query.length)); };
  function draw(){
    const v = q.value.trim(); if (!v){ close(); return; }
    results = searchIngredients(v).slice(0, 40);
    const exact = results.some(r => r.i.name.toLowerCase() === v.toLowerCase() || r.i.aliases.some(a => a.toLowerCase() === v.toLowerCase()));
    let html = results.map((r, n) => `<li class="opt" role="option" id="${p}-o${n}" data-n="${n}" aria-selected="${n === active}">
      <div class="o-main"><div class="o-name">${hl(r.i.name, v)}</div><div class="o-sub">${r.via ? esc(r.via) + ' · ' : ''}${esc(r.i.category)}</div></div>
      ${DB.has(r.i.name) ? '<span class="o-have">In kitchen</span>' : ''}</li>`).join('');
    if (!exact) html += `<li class="opt custom" role="option" id="${p}-o${results.length}" data-n="${results.length}" aria-selected="${active === results.length}"><div class="o-main"><div class="o-name">+ Add “${esc(v)}”</div><div class="o-sub">Not in our list · added as your own item</div></div></li>`;
    list.innerHTML = html || `<li class="combo-empty">No matches.</li>`;
    list.hidden = false; q.setAttribute('aria-expanded', 'true');
    list.querySelectorAll('.opt').forEach(o => { o.addEventListener('mousedown', e => e.preventDefault()); o.addEventListener('click', () => choose(Number(o.dataset.n))); });
  }
  function choose(n){
    const v = q.value.trim(); const item = n < results.length ? results[n].i : {name: v.replace(/^./, c => c.toUpperCase()), category: 'Others', allowed_units: CUSTOM_UNITS, default_unit: 'pcs', custom: true};
    close(); q.value = ''; showPicked(item);
  }
  function showPicked(item){
    const existing = DB.ingredients().find(i => i.name.toLowerCase() === item.name.toLowerCase());
    let unit = existing ? existing.unit : item.default_unit; let qty = existing && existing.quantity != null ? existing.quantity : '';
    const step = u => ({g: 50, kg: .5, ml: 100, L: .5, tsp: 1, tbsp: 1, pinch: 1}[u] || 1);
    picked.innerHTML = `<div class="picked" role="group" aria-label="Add ${esc(item.name)}">
      <div class="picked-top"><div><b>${esc(item.name)}</b><div class="tiny muted">${esc(item.category)}${existing ? ' · already in your kitchen' : ''}</div></div>
        <button class="del" type="button" data-cancel aria-label="Cancel">${ICON.close}</button></div>
      <div><span class="label">Quantity · optional</span>
      <div class="qty-row" style="margin-top:8px">
        <div class="stepper"><button type="button" data-step="-1" aria-label="Less">−</button><input type="number" inputmode="decimal" min="0" step="any" id="${p}-qty" value="${qty}" placeholder="–" aria-label="Quantity"><button type="button" data-step="1" aria-label="More">+</button></div>
        <div class="units" role="group" aria-label="Unit">${item.allowed_units.map(u => `<button type="button" class="unit" data-unit="${u}" aria-pressed="${u === unit}">${u}</button>`).join('')}</div>
      </div></div>
      <button class="btn leaf block" type="button" data-confirm>${existing ? 'Update in kitchen' : 'Add to kitchen'}</button>
    </div>`;
    const qi = $(`#${p}-qty`);
    picked.querySelectorAll('[data-unit]').forEach(b => b.addEventListener('click', () => { unit = b.dataset.unit; picked.querySelectorAll('[data-unit]').forEach(x => x.setAttribute('aria-pressed', x === b)); }));
    picked.querySelectorAll('[data-step]').forEach(b => b.addEventListener('click', () => { const s = step(unit) * Number(b.dataset.step); const nv = Math.max(0, (Number(qi.value) || 0) + s); qi.value = nv ? +nv.toFixed(2) : ''; }));
    picked.querySelector('[data-cancel]').addEventListener('click', () => { picked.innerHTML = ''; q.focus(); });
    const confirm = () => {
      const {row, updated} = DB.addIngredient(item.name, qi.value, unit);
      picked.innerHTML = ''; badges(); onChange();
      toast(`${updated ? 'Updated' : 'Added'} ${row.name}${row.quantity != null ? ' · ' + fmtQty(row) : ''}`, updated ? null : {run: () => { DB.removeIngredient(row.id); badges(); onChange(); }});
      const nq = $(`#${p}-q`); if (nq) nq.focus();
    };
    picked.querySelector('[data-confirm]').addEventListener('click', confirm);
    qi.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); confirm(); } });
    qi.focus();
  }
  q.addEventListener('input', () => { active = -1; draw(); });
  q.addEventListener('focus', () => { if (q.value.trim()) draw(); });
  q.addEventListener('blur', () => setTimeout(close, 120));
  q.addEventListener('keydown', e => {
    const total = list.querySelectorAll('.opt').length;
    if (e.key === 'ArrowDown'){ e.preventDefault(); if (list.hidden) draw(); active = Math.min(total - 1, active + 1); }
    else if (e.key === 'ArrowUp'){ e.preventDefault(); active = Math.max(0, active - 1); }
    else if (e.key === 'Enter'){ e.preventDefault(); if (total) choose(active >= 0 ? active : 0); return; }
    else if (e.key === 'Escape'){ close(); return; } else return;
    list.querySelectorAll('.opt').forEach((o, n) => o.setAttribute('aria-selected', n === active));
    const el = $(`#${p}-o${active}`); if (el){ el.scrollIntoView({block: 'nearest'}); q.setAttribute('aria-activedescendant', el.id); }
  });
  view.querySelectorAll(`[data-browse]`).forEach(b => b.addEventListener('click', () => openBrowse(b.dataset.browse, onChange)));
  view.querySelectorAll(`[data-pack]`).forEach(b => b.addEventListener('click', () => addPack(PACKS[Number(b.dataset.pack)], onChange)));
}
function addPack(pack, onChange){
  const added = pack.items.filter(n => !DB.has(n)).map(n => DB.addIngredient(n, '', ING_BY_NAME[n.toLowerCase()].default_unit).row);
  badges(); onChange && onChange();
  if (!added.length) return toast(`You already have all of ${pack.name.toLowerCase()}`);
  toast(`Added ${added.length} item${added.length > 1 ? 's' : ''} from ${pack.name.toLowerCase()}`, {run: () => { added.forEach(r => DB.removeIngredient(r.id)); badges(); onChange && onChange(); if (!$('#sheet').hidden) drawSheet(); }});
}

/* ---------- Browse sheet (bottom sheet on phone, modal on tablet) ---------- */
const sheetState = {tab: 'Popular', filter: '', onChange: null, lastFocus: null};
function openBrowse(tab, onChange){
  sheetState.tab = tab; sheetState.filter = ''; sheetState.onChange = onChange; sheetState.lastFocus = document.activeElement;
  const sh = $('#sheet'), sc = $('#scrim'); sh.hidden = false; sc.hidden = false;
  drawSheet(); requestAnimationFrame(() => { sh.classList.add('show'); sc.classList.add('show'); });
  document.body.style.overflow = 'hidden'; document.body.classList.add('sheet-open'); setTimeout(() => $('#sheet-close').focus(), 50);
}
function closeBrowse(){
  const sh = $('#sheet'), sc = $('#scrim'); sh.classList.remove('show'); sc.classList.remove('show'); document.body.style.overflow = ''; document.body.classList.remove('sheet-open');
  setTimeout(() => { sh.hidden = true; sc.hidden = true; }, reduce ? 0 : 230);
  if (sheetState.onChange) sheetState.onChange(); if (sheetState.lastFocus) sheetState.lastFocus.focus();
}
function drawSheet(){
  const sh = $('#sheet'); const have = new Set(DB.ingredients().map(i => i.name.toLowerCase()));
  const tabs = ['Popular', ...CATEGORIES];
  const items = sheetState.filter ? searchIngredients(sheetState.filter).map(r => r.i)
    : sheetState.tab === 'Popular' ? POPULAR.map(n => ING_BY_NAME[n.toLowerCase()]) : ING.filter(i => i.category === sheetState.tab);
  const count = c => c === 'Popular' ? POPULAR.filter(n => have.has(n.toLowerCase())).length : ING.filter(i => i.category === c && have.has(i.name.toLowerCase())).length;
  sh.innerHTML = `<div class="grab" aria-hidden="true"></div>
  <div class="sheet-head">
    <div class="sheet-title"><div><h2 id="sheet-title">Add from the list</h2><p class="tiny muted">Tap to add, tap again to remove. Set quantities later in My kitchen.</p></div>
      <button class="del" type="button" id="sheet-close" aria-label="Close">${ICON.close}</button></div>
    <div class="combo"><span class="combo-icon">${ICON.search}</span><input class="input combo-input" id="sheet-q" placeholder="Filter, e.g. dal, masala, kela" value="${esc(sheetState.filter)}" aria-label="Filter ingredients"></div>
    ${sheetState.filter ? '' : `<div class="tabs" role="tablist" aria-label="Categories">${tabs.map(t => { const n = count(t); return `<button class="tab" role="tab" aria-selected="${t === sheetState.tab}" data-tab="${esc(t)}">${esc(t)}${n ? `<span class="n">${n}</span>` : ''}</button>`; }).join('')}</div>`}
  </div>
  <div class="sheet-body">
    ${!sheetState.filter && sheetState.tab === 'Popular' ? PACKS.map((pk, n) => { const missing = pk.items.filter(x => !have.has(x.toLowerCase())).length; return `<div class="pack"><div><b>${pk.name}</b><div class="tiny muted">${pk.items.join(', ')}</div></div><button class="btn ${missing ? 'solid' : ''}" type="button" data-pk="${n}" ${missing ? '' : 'disabled'}>${missing ? `Add ${missing}` : 'All added'}</button></div>`; }).join('') : ''}
    ${items.length ? `<div class="tiles">${items.map(i => { const on = have.has(i.name.toLowerCase()); return `<button type="button" class="tile" data-tile="${esc(i.name)}" aria-pressed="${on}"><span class="t-name">${esc(i.name)}</span>${i.aliases[0] ? `<span class="t-alias">${esc(i.aliases[0])}</span>` : ''}<span class="t-mark" aria-hidden="true">${on ? '✓' : '+'}</span></button>`; }).join('')}</div>` : `<p class="muted">Nothing matches “${esc(sheetState.filter)}”. Close this and type it in the search box to add it as your own item.</p>`}
  </div>
  <div class="sheet-foot"><span class="small muted"><b style="color:var(--ink)">${have.size}</b> in your kitchen</span><button class="btn leaf" type="button" id="sheet-done">Done</button></div>`;
  $('#sheet-close').addEventListener('click', closeBrowse); $('#sheet-done').addEventListener('click', closeBrowse);
  const f = $('#sheet-q'); f.addEventListener('input', () => { sheetState.filter = f.value; drawSheet(); const nf = $('#sheet-q'); nf.focus(); nf.setSelectionRange(nf.value.length, nf.value.length); });
  sh.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => { sheetState.tab = b.dataset.tab; drawSheet(); const a = sh.querySelector('.tab[aria-selected="true"]'); if (a) a.scrollIntoView({inline: 'center', block: 'nearest'}); }));
  sh.querySelectorAll('[data-pk]').forEach(b => b.addEventListener('click', () => { addPack(PACKS[Number(b.dataset.pk)], null); drawSheet(); }));
  sh.querySelectorAll('[data-tile]').forEach(b => b.addEventListener('click', () => {
    const n = b.dataset.tile;
    if (DB.has(n)){ const row = DB.removeByName(n); toast(`Removed ${n}`, {run: () => { DB.restoreIngredient(row); badges(); drawSheet(); }}); }
    else { DB.addIngredient(n, '', ING_BY_NAME[n.toLowerCase()].default_unit); toast(`Added ${n}`); }
    badges(); const on = DB.has(n); b.setAttribute('aria-pressed', on); b.querySelector('.t-mark').textContent = on ? '✓' : '+';
    sh.querySelector('.sheet-foot b').textContent = DB.ingredients().length;
  }));
}
$('#scrim').addEventListener('click', closeBrowse);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet').hidden) closeBrowse(); });

  view.innerHTML = `
  <section class="hello"><h1>${greeting()}, ${esc(u.name)}</h1><p class="muted">What's in your kitchen today?</p></section>
  <div class="home-grid">
    <div class="card">
      <div class="card-head"><h2>Add ingredients</h2><a class="btn ghost small" href="#/kitchen" style="min-height:36px; padding:6px 10px">${ings.length} in kitchen →</a></div>
      ${addPanelHTML('home')}
      <div id="recent">${recentHTML()}</div>
    </div>
    <div class="col-right stack">
      <div class="card stack">
        <h2>What should I cook?</h2>
        <div class="seg" role="group" aria-label="Meal">${['breakfast','lunch','both'].map(s => `<button type="button" data-slot="${s}" aria-pressed="${ui.slot === s}">${s[0].toUpperCase() + s.slice(1)}</button>`).join('')}</div>

        ${ings.length < 2 ? `<p class="small muted" style="text-align:center">Add at least ${2 - ings.length} more ingredient${ings.length === 1 ? '' : 's'} to get a suggestion.</p>` : `<p class="tiny muted" style="text-align:center">Uses only your ${ings.length} ingredients plus your staples.</p>`}

function recentHTML(){
  const ings = DB.ingredients().slice(-8).reverse(); if (!ings.length) return '';
  return `<div style="margin-top:18px"><span class="label">Recently added</span><div class="chips" style="margin-top:8px">${ings.map(i => `<span class="chip">${esc(i.name)}${i.quantity != null ? ` <span class="tiny muted">${esc(fmtQty(i))}</span>` : ''}<button class="x" data-rm="${i.id}" aria-label="Remove ${esc(i.name)}">×</button></span>`).join('')}</div></div>`;
}
function bindRecent(){ view.querySelectorAll('[data-rm]').forEach(b => b.addEventListener('click', () => { const row = DB.removeIngredient(b.dataset.rm); badges(); refreshHomeSide(); toast(`Removed ${row.name}`, {run: () => { DB.restoreIngredient(row); badges(); refreshHomeSide(); }}); })); }
function refreshHomeSide(){
  if ((location.hash.replace(/^#\/?/, '') || 'home') !== 'home') return;
  const n = DB.ingredients().length;
  $('#recent').innerHTML = recentHTML(); bindRecent();
  const s = $('#suggest'); s.disabled = n < 2 || ui.loading;
  const hint = s.nextElementSibling; if (hint) hint.outerHTML = n < 2 ? `<p class="small muted" style="text-align:center">Add at least ${2 - n} more ingredient${n === 1 ? '' : 's'} to get a suggestion.</p>` : `<p class="tiny muted" style="text-align:center">Uses only your ${n} ingredients plus your staples.</p>`;
  const kl = view.querySelector('.card-head .btn.ghost'); if (kl) kl.textContent = `${n} in kitchen →`;
}
async function suggest(){
  const u = DB.currentUser(); ui.loading = true; ui.error = null; ui.result = null;
  $('#suggest').disabled = true; $('#suggest').textContent = 'Checking your kitchen…'; drawResults();
  if (innerWidth < 900) $('#results').scrollIntoView({behavior: reduce ? 'auto' : 'smooth', block: 'start'});
  const avoid = DB.suggestions().slice(0, 6).flatMap(s => s.meals.map(m => m.dish));
  try {
    const res = await AI.suggest({ingredients: DB.ingredients(), staples: u.staples, slot: ui.slot, diet: u.diet, avoid});
    const rec = {id: uid(), slot: ui.slot, ingredients_snapshot: DB.ingredients().map(i => i.name), ...res, created_at: new Date().toISOString()};
    if (rec._saved){ delete rec._saved; C.suggestions.unshift(rec); } else DB.saveSuggestion(rec);
    ui.result = rec;
    if (typeof ui.remaining === 'number' && ui.remaining <= 3) toast(ui.remaining ? `${ui.remaining} suggestion${ui.remaining === 1 ? '' : 's'} left today` : "That was today's last suggestion");
  } catch(e){ ui.error = e.message || 'Something went wrong. Try again.'; }
  ui.loading = false; const s = $('#suggest'); if (s){ s.disabled = DB.ingredients().length < 2; s.textContent = 'Suggest food'; } drawResults();
}
function drawResults(){ const r = $('#results'); if (r){ r.innerHTML = renderResults(); bindResults(); } }
function renderResults(){
  if (ui.loading) return [1, 2].map(() => `<div class="skel"><i style="width:28%"></i><i style="width:65%; height:20px"></i><i style="width:90%"></i><i style="width:50%"></i></div>`).join('');
  if (ui.error) return `<div class="notice err"><b>That didn't work.</b><span>${esc(ui.error)}</span><div><button class="btn" data-retry>Try again</button></div></div>`;
  const r = ui.result;
  if (!r) return `<div class="placeholder"><b style="color:var(--ink)">Your suggestion appears here.</b><p class="small" style="margin-top:4px">Pick a meal and press Suggest food.</p></div>`;
  let html = '';
  if (!r.possible) html += `<div class="notice warn"><b>${esc(r.reason)}</b>${r.nearest_dish ? `<span>You're closest to <b>${esc(r.nearest_dish)}</b>${(r.nearest_missing || []).length ? `, just missing <b>${esc(r.nearest_missing.join(' and '))}</b>` : ''}.</span>` : ''}${r.unlock ? `<span>Adding <b>${esc(r.unlock)}</b> would unlock the most dishes.</span><div><button class="btn solid" data-unlock="${esc(r.unlock)}">Add ${esc(r.unlock)} and try again</button></div>` : ''}</div>`;
  html += r.meals.map(m => {
    const fav = DB.isFavourite(m.id), rate = DB.rating(m.id);
    return `<article class="meal">
      <div class="meal-top"><div><span class="slot">${esc(m.slot)}</span><h3>${esc(m.dish)}</h3></div><span class="mins">${ICON.clock}${esc(m.minutes)} min</span></div>
      <p class="why">${esc(m.why)}</p>
      <div><span class="label">Uses from your kitchen</span><div class="chips" style="margin-top:6px">${m.uses.map(x => `<span class="chip use">${esc(x)}</span>`).join('')}</div></div>
      <div class="meal-actions">
        <button class="act heart" data-fav="${m.id}" aria-pressed="${fav}">${ICON.heart}${fav ? 'Saved' : 'Save'}</button>
        <span class="spacer"></span>
        <button class="act up" data-rate="${m.id}" data-v="1" aria-pressed="${rate === 1}" aria-label="Good suggestion">${ICON.up}</button>
        <button class="act down" data-rate="${m.id}" data-v="-1" aria-pressed="${rate === -1}" aria-label="Not useful">${ICON.down}</button>
      </div></article>`;
  }).join('');
  html += `<button class="btn block" data-again>Try another</button>`;
  return html;
}
function bindResults(){
  const r = ui.result;
  view.querySelectorAll('[data-fav]').forEach(b => b.addEventListener('click', () => { const m = r.meals.find(x => x.id === b.dataset.fav); const on = DB.toggleFavourite(m); toast(on ? `Saved ${m.dish} to favourites` : `Removed ${m.dish} from favourites`); badges(); drawResults(); }));
  view.querySelectorAll('[data-rate]').forEach(b => b.addEventListener('click', () => { const m = r.meals.find(x => x.id === b.dataset.rate); const v = Number(b.dataset.v); const was = DB.rating(m.id); DB.rate(m, was === v ? 0 : v); if (was !== v) toast(v === 1 ? 'Thanks, noted' : 'Noted. Try another?'); drawResults(); }));
  const again = view.querySelector('[data-again]'); if (again) again.addEventListener('click', suggest);
  const retry = view.querySelector('[data-retry]'); if (retry) retry.addEventListener('click', suggest);
  const unlock = view.querySelector('[data-unlock]'); if (unlock) unlock.addEventListener('click', () => { const n = unlock.dataset.unlock; DB.addIngredient(n, '', (ING_BY_NAME[n.toLowerCase()] || {}).default_unit); badges(); refreshHomeSide(); toast(`Added ${n}`); suggest(); });
}

/* =========================================================
   MY KITCHEN
   ========================================================= */
function renderKitchen(){
  view.innerHTML = `<div class="narrow">
  <div class="page-head"><a class="back" href="#/" aria-label="Back to home">${ICON.back}</a><div><h1>My kitchen</h1><p class="muted small" id="k-count"></p></div></div>
  <div class="stack">
    <div class="card"><h2 style="margin-bottom:14px">Add ingredients</h2>${addPanelHTML('kit')}</div>
    <div id="k-list"></div>
  </div></div>`;
  bindAddPanel('kit', drawKitchenList);
  drawKitchenList();
}
function drawKitchenList(){
  const box = $('#k-list'); if (!box) return;
  const ings = DB.ingredients();
  $('#k-count').textContent = `${ings.length} ingredient${ings.length === 1 ? '' : 's'} · quantities are optional`;
  if (!ings.length){ box.innerHTML = `<div class="empty"><h2>Your kitchen is empty</h2><p>Search above or tap <b>Everyday basics</b> to add ten common items at once.</p></div>`; return; }
  const cats = [...CATEGORIES, 'Others'];
  const groups = cats.map(c => [c, ings.filter(i => i.category === c).sort((a, b) => a.name.localeCompare(b.name))]).filter(g => g[1].length);
  box.innerHTML = `<div class="stack">${groups.map(([c, items]) => `<div><div class="group-h"><span class="label">${esc(c)}</span><span class="small muted">${items.length}</span></div>
    <div class="rows">${items.map(i => { const meta = ING_BY_NAME[i.name.toLowerCase()]; const units = meta ? meta.allowed_units : CUSTOM_UNITS; return `<div class="row">
      <span class="r-name">${esc(i.name)}${meta && meta.aliases[0] ? `<span class="r-sub">${esc(meta.aliases[0])}</span>` : ''}</span>
      <span class="r-ctl"><input class="input r-qty" type="number" min="0" step="any" inputmode="decimal" placeholder="Qty" value="${i.quantity ?? ''}" data-qty="${i.id}" id="q-${i.id}" aria-label="Quantity of ${esc(i.name)}">
      <select data-unit="${i.id}" id="u-${i.id}" aria-label="Unit for ${esc(i.name)}">${units.map(x => `<option ${x === i.unit ? 'selected' : ''}>${x}</option>`).join('')}</select></span>
      <button class="del" data-del="${i.id}" aria-label="Remove ${esc(i.name)}">${ICON.trash}</button></div>`; }).join('')}</div></div>`).join('')}
    <div id="clear-zone" style="text-align:center"><button class="btn ghost" id="clear-btn">Clear kitchen</button></div></div>`;
  box.querySelectorAll('[data-qty]').forEach(inp => inp.addEventListener('change', () => { DB.updateIngredient(inp.dataset.qty, {quantity: inp.value === '' ? null : Number(inp.value)}); toast('Quantity saved'); }));
  box.querySelectorAll('[data-unit]').forEach(sel => sel.addEventListener('change', () => { DB.updateIngredient(sel.dataset.unit, {unit: sel.value}); toast('Unit saved'); }));
  box.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => { const row = DB.removeIngredient(b.dataset.del); badges(); drawKitchenList(); toast(`Removed ${row.name}`, {run: () => { DB.restoreIngredient(row); badges(); drawKitchenList(); }}); }));
  $('#clear-btn').addEventListener('click', () => {
    const all = DB.ingredients(); DB.setIngredients([]); badges(); drawKitchenList();
    toast(`Cleared ${all.length} ingredients`, {run: () => { DB.setIngredients(all); badges(); drawKitchenList(); }});
  });
}

/* =========================================================
   FAVOURITES
   ========================================================= */
function renderFavourites(){
  const favs = DB.favourites(); const have = new Set(DB.ingredients().map(i => i.name.toLowerCase()));
  view.innerHTML = `<div class="narrow">
  <div class="page-head"><a class="back" href="#/" aria-label="Back to home">${ICON.back}</a><div><h1>Favourites</h1><p class="muted small">${favs.length} saved dish${favs.length === 1 ? '' : 'es'}</p></div></div>
  ${favs.length ? `<div class="fav-grid">${favs.map(f => { const miss = f.uses.filter(x => !have.has(x.toLowerCase())); return `<article class="meal">
      <div class="meal-top"><div><span class="slot">${esc(f.slot)}</span><h3>${esc(f.dish)}</h3></div><span class="mins">${ICON.clock}${esc(f.minutes)} min</span></div>
      ${miss.length ? `<span class="status no">Missing: ${esc(miss.join(', '))}</span>` : `<span class="status ok">✓ You can make this now</span>`}
      <div class="chips">${f.uses.map(x => `<span class="chip use">${esc(x)}</span>`).join('')}</div>
      <div class="meal-actions"><span class="small muted">Saved ${new Date(f.created_at).toLocaleDateString(undefined, {day: 'numeric', month: 'short'})}</span><span class="spacer"></span><button class="act heart" aria-pressed="true" data-unfav="${f.id}">${ICON.heart}Remove</button></div>
    </article>`; }).join('')}</div>`
  : `<div class="empty"><h2>No favourites yet</h2><p>Tap <b>Save</b> on any suggestion to keep it here. You'll see straight away whether you can make it with what's in your kitchen.</p><a class="btn leaf" href="#/">Get a suggestion</a></div>`}</div>`;
  view.querySelectorAll('[data-unfav]').forEach(b => b.addEventListener('click', () => { const f = DB.removeFavourite(b.dataset.unfav); badges(); renderFavourites(); toast(`Removed ${f.dish}`, {run: () => { DB.restoreFavourite(f); badges(); renderFavourites(); }}); }));
}

/* =========================================================
   SETTINGS — no API key here; the server holds it
   ========================================================= */
function renderSettings(){
  const u = DB.currentUser(); const nSug = DB.suggestions().length, nFav = DB.favourites().length;
  view.innerHTML = `<div class="narrow">
  <div class="page-head"><a class="back" href="#/" aria-label="Back to home">${ICON.back}</a><h1>Settings</h1></div>
  <div class="stack">
    <div class="card stack"><span class="label">Profile</span>
      <div class="field"><label for="s-name">Name</label><input class="input" id="s-name" value="${esc(u.name)}"></div>
      <div class="field"><label>Email</label><span>${esc(u.email)}</span></div></div>
    <div class="card stack"><span class="label">Food preference</span>
      <div class="seg" role="group" aria-label="Food preference">${[['veg','Veg'],['egg','Eggetarian'],['nonveg','Non-veg']].map(([k, l]) => `<button type="button" data-diet="${k}" aria-pressed="${u.diet === k}">${l}</button>`).join('')}</div>
      <p class="small muted">Suggestions never include food outside this preference.</p></div>
    <div class="card stack"><span class="label">Always in my kitchen</span>
      <p class="small muted">Staples you never run out of. They're assumed available, so you don't need to add them.</p>
      <div class="chips">${u.staples.map((s, n) => `<span class="chip">${esc(s)}<button class="x" data-unstaple="${n}" aria-label="Remove ${esc(s)}">×</button></span>`).join('')}</div>
      <div class="combo"><span class="combo-icon">${ICON.search}</span><input class="input combo-input" id="staple-q" placeholder="Add a staple, e.g. ghee, hing" autocomplete="off" aria-label="Add a staple"><ul class="combo-list" id="staple-list" role="listbox" hidden></ul></div></div>
    <div class="card stack"><span class="label">Your activity</span><p>${nSug} suggestion${nSug === 1 ? '' : 's'} so far · ${nFav} favourite${nFav === 1 ? '' : 's'}</p></div>
    <div class="card stack"><span class="label">Account</span>
      <button class="btn" id="signout">Log out</button>
      <div id="del-zone"><button class="btn ghost block" id="del-btn" style="color:var(--danger)">Delete my data</button></div></div>
  </div></div>`;
  $('#s-name').addEventListener('change', e => { DB.updateProfile({name: e.target.value.trim() || u.name}); toast('Name saved'); });
  view.querySelectorAll('[data-diet]').forEach(b => b.addEventListener('click', () => { DB.updateProfile({diet: b.dataset.diet}); toast('Preference saved'); renderSettings(); }));
  view.querySelectorAll('[data-unstaple]').forEach(b => b.addEventListener('click', () => { const st = u.staples.slice(); st.splice(Number(b.dataset.unstaple), 1); DB.updateProfile({staples: st}); renderSettings(); }));
  const sq = $('#staple-q'), sl = $('#staple-list');
  sq.addEventListener('input', () => { const r = searchIngredients(sq.value).slice(0, 8); sl.hidden = !r.length; sl.innerHTML = r.map(x => `<li class="opt" data-st="${esc(x.i.name)}"><div class="o-main"><div class="o-name">${esc(x.i.name)}</div><div class="o-sub">${esc(x.i.category)}</div></div></li>`).join('');
    sl.querySelectorAll('[data-st]').forEach(o => { o.addEventListener('mousedown', e => e.preventDefault()); o.addEventListener('click', () => { const n = o.dataset.st; if (!u.staples.includes(n)) DB.updateProfile({staples: [...u.staples, n]}); toast(`${n} added to staples`); renderSettings(); }); }); });
  sq.addEventListener('blur', () => setTimeout(() => sl.hidden = true, 120));
  $('#signout').addEventListener('click', async () => { await DB.signOut(); ui.result = null; location.hash = '#/login'; route(); });
  $('#del-btn').addEventListener('click', () => {
    $('#del-zone').innerHTML = `<div class="notice err"><b>Delete your kitchen, favourites and history?</b><span>Your account stays. This can't be undone.</span><div class="chips"><button class="btn danger" id="del-yes">Yes, delete</button><button class="btn" id="del-no">Cancel</button></div></div>`;
    $('#del-yes').addEventListener('click', () => { DB.deleteMyData(); ui.result = null; badges(); toast('Your data was deleted'); renderSettings(); });
    $('#del-no').addEventListener('click', renderSettings);
  });
}

/* =========================================================
   ROUTER
   ========================================================= */
let recovering = false;
function route(){
  const r = location.hash.replace(/^#\/?/, '') || 'home';
  if (recovering) return renderNewPassword();
  if (!DB.currentUser()) return r === 'signup' ? renderSignup() : renderLogin();
  if (r === 'login' || r === 'signup'){ location.hash = '#/'; return; }
  $('#top').hidden = false; navState(r); badges();
  ({kitchen: renderKitchen, favourites: renderFavourites, settings: renderSettings}[r] || renderHome)();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
(async function boot(){
  if (!sb){
    view.innerHTML = `<div class="auth"><div class="auth-box card stack"><h1>Start Rasoi first</h1>
      <p>This page has to be opened through the Rasoi server, not as a file or from another address.</p>
      <p class="small muted">1. In Terminal run: <code>node ~/job-search-agent/kitchen-app/server.js</code><br>2. Then open <b>http://localhost:8787</b></p></div></div>`;
    return;
  }
  view.innerHTML = '<div class="auth"><p class="muted">Loading your kitchen…</p></div>';
  sb.auth.onAuthStateChange((event) => { if (event === 'PASSWORD_RECOVERY'){ recovering = true; route(); } });
  try {
    const {data} = await sb.auth.getSession();
    if (data.session) await DB.load(data.session);
  } catch(e){ console.error(e); toast("Couldn't load your data. Check your connection."); }
  route();
})();
</script>
</body>
</html>
