<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FF9F7F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rasoi">
<title>Rasoi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,750&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone = content + bottom tab bar; tablet (>=768) = icon rail on the left; desktop (>=1100) = labelled sidebar.
   Pastel: peach coral for actions, lime for "you have it", lilac for saved. Dark text on every colour. */
:root{
  --bg:#FBF9F7; --surface:#FFFFFF; --sunk:#F3EFEB; --ink:#1C1820; --ink-2:#55505C; --ink-3:#736D7A;
  --line:#ECE6E1; --line-strong:#CFC7C0;
  --leaf:#FF9F7F; --leaf-ink:#B23F16; --leaf-soft:#FFEDE5; --on-leaf:#1C1820;        /* peach coral: actions and the main card */
  --ok:#A3E635; --ok-ink:#3F6212; --ok-soft:#EEFBD5;                                  /* lime: "you have it" */
  --haldi:#C9A7FF; --haldi-soft:#F3EBFF; --haldi-ink:#6B2FC9;                         /* lilac: saved */
  --hero-a:#FFC3A8; --hero-b:#FFE49A; --hero-ink:#1C1820; --hero-ink-2:#4A4452;
  --danger:#B23A2E; --danger-soft:#F8E3E0;
  --shadow:0 1px 2px rgba(21,32,26,.05), 0 6px 20px rgba(21,32,26,.06);
  --shadow-lg:0 -10px 40px rgba(21,32,26,.18);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --r:22px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131117; --surface:#1C1921; --sunk:#26222C; --ink:#F3F0F7; --ink-2:#BDB6C6; --ink-3:#958DA0;
  --line:#2E2935; --line-strong:#4D4656;
  --leaf:#FFA585; --leaf-ink:#FFB59A; --leaf-soft:#3A2420; --on-leaf:#1C1820;
  --ok:#B5F04F; --ok-ink:#C6F57A; --ok-soft:#24301A;
  --haldi:#D2B5FF; --haldi-soft:#2E2440; --haldi-ink:#DCC6FF;
  --hero-a:#FFB494; --hero-b:#FFDE85;
  --danger:#F08A7E; --danger-soft:#3A1D19;
  --shadow:0 1px 2px rgba(0,0,0,.35); --shadow-lg:0 -10px 40px rgba(0,0,0,.5); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#131117; --surface:#1C1921; --sunk:#26222C; --ink:#F3F0F7; --ink-2:#BDB6C6; --ink-3:#958DA0;
  --line:#2E2935; --line-strong:#4D4656;
  --leaf:#FFA585; --leaf-ink:#FFB59A; --leaf-soft:#3A2420; --on-leaf:#1C1820;
  --ok:#B5F04F; --ok-ink:#C6F57A; --ok-soft:#24301A;
  --haldi:#D2B5FF; --haldi-soft:#2E2440; --haldi-ink:#DCC6FF;
  --hero-a:#FFB494; --hero-b:#FFDE85;
  --danger:#F08A7E; --danger-soft:#3A1D19;
  --shadow:0 1px 2px rgba(0,0,0,.35); --shadow-lg:0 -10px 40px rgba(0,0,0,.5); color-scheme:dark;}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--leaf); outline-offset:2px; border-radius:10px}
[hidden]{display:none !important}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
p{margin:0}
h1,h2,h3{font-family:var(--f-display); letter-spacing:-.02em; margin:0; text-wrap:balance}
h1{font-size:clamp(1.65rem, 4.2vw, 2.2rem); font-weight:750; line-height:1.08}
h2{font-size:1.25rem; font-weight:650; line-height:1.25}
h3{font-size:1.18rem; font-weight:650; line-height:1.25}
.muted{color:var(--ink-2)} .small{font-size:.88rem} .tiny{font-size:.78rem}
.label{font-family:var(--f-display); font-size:.72rem; font-weight:650; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3)}
.stack{display:flex; flex-direction:column; gap:14px}
.row-flex{display:flex; align-items:center; gap:10px}
.spacer{flex:1}

/* ---------- app shell ---------- */
.app{min-height:100vh}
.main{padding:calc(env(safe-area-inset-top,0px) + 8px) 16px calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 32px)}
.page{max-width:720px; margin:0 auto}
.page.wide{max-width:1100px}
.page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; padding-block:18px 18px}
.page-head p{margin-top:4px}

/* bottom bar (phone) */
.nav{position:fixed; z-index:30; left:0; right:0; bottom:0; display:flex; background:color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-top:1px solid var(--line); padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.nav .brand{display:none}
.nav a{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; min-height:52px; text-decoration:none; color:var(--ink-3); font-size:.74rem; font-weight:600; border-radius:14px; position:relative}
.nav a .ic{width:56px; height:30px; display:grid; place-items:center; border-radius:99px; transition:background .15s}
.nav a[aria-current="page"]{color:var(--leaf-ink)}
.nav a[aria-current="page"] .ic{background:var(--leaf-soft)}
.nav .badge{position:absolute; top:2px; left:calc(50% + 6px); min-width:19px; height:19px; padding:0 5px; border-radius:99px; background:var(--leaf); color:var(--on-leaf); font-size:.68rem; font-weight:700; display:grid; place-items:center; font-variant-numeric:tabular-nums; border:2px solid var(--surface)}
.nav .badge.fav{background:var(--haldi); color:var(--on-leaf)}
.nav .badge:empty{display:none}

/* rail (tablet) and sidebar (desktop) */
@media (min-width:768px){
  :root{--nav-h:0px}
  .nav{top:0; right:auto; width:88px; flex-direction:column; justify-content:flex-start; gap:6px; border-top:0; border-right:1px solid var(--line); padding:calc(env(safe-area-inset-top,0px) + 16px) 8px 16px}
  .nav .brand{display:grid; place-items:center; margin-bottom:14px}
  .nav a{flex:none; min-height:64px}
  .main{margin-left:88px; padding:calc(env(safe-area-inset-top,0px) + 16px) 32px 48px}
}
@media (min-width:1100px){
  .nav{width:236px; padding-inline:14px; align-items:stretch}
  .nav .brand{display:flex; justify-content:flex-start; gap:10px; padding:4px 10px 18px}
  .nav .brand b{display:inline}
  .nav a{flex-direction:row; justify-content:flex-start; gap:12px; min-height:48px; padding:0 12px; font-size:.95rem}
  .nav a .ic{width:28px; height:28px}
  .nav a[aria-current="page"]{background:var(--leaf-soft)}
  .nav a[aria-current="page"] .ic{background:none}
  .nav .badge{position:static; margin-left:auto; border:0}
  .main{margin-left:236px; padding-inline:40px}
}
.logo-mark{width:40px; height:40px; border-radius:12px; background:var(--leaf); display:grid; place-items:center; color:var(--on-leaf); flex:none}
.brand b{display:none; font-family:var(--f-display); font-weight:750; font-size:1.35rem; letter-spacing:-.02em; color:var(--ink); align-self:center}

/* ---------- controls ---------- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:48px; padding:10px 18px; border-radius:14px; border:1px solid var(--line-strong); background:var(--surface); font-weight:600; text-decoration:none; color:var(--ink); transition:transform .1s, border-color .15s, background .15s; white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn:active{transform:scale(.98)}
.btn.solid{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.btn.leaf{background:var(--leaf); color:var(--on-leaf); border-color:var(--leaf)}
.btn.soft{background:var(--leaf-soft); color:var(--leaf-ink); border-color:transparent}
.btn.ghost{background:transparent; border-color:transparent; color:var(--ink-2)}
.btn.sm{min-height:40px; padding:6px 14px; border-radius:12px; font-size:.9rem}
.btn.block{width:100%}
.btn.big{min-height:60px; font-family:var(--f-display); font-size:1.2rem; font-weight:750; border-radius:18px}
.btn:disabled{opacity:.45; cursor:not-allowed; transform:none}
.icon-btn{width:44px; height:44px; display:grid; place-items:center; border-radius:13px; border:1px solid var(--line); background:var(--surface); color:var(--ink-2)}
.icon-btn:hover{color:var(--ink); border-color:var(--line-strong)}
.input{width:100%; min-width:0; min-height:50px; padding:12px 14px; border-radius:14px; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink)}
.input::placeholder{color:var(--ink-3)}
.input:focus{outline:none; border-color:var(--leaf); box-shadow:0 0 0 3px var(--leaf-soft)}
.search{position:relative}
.search .input{padding-left:46px}
.search .s-ic{position:absolute; left:15px; top:50%; transform:translateY(-50%); color:var(--ink-3); pointer-events:none}
.field{display:flex; flex-direction:column; gap:6px; min-width:0}
.field > label{font-size:.88rem; font-weight:600; color:var(--ink-2)}
.err-text{color:var(--danger); font-size:.88rem; font-weight:600}
.seg{display:grid; grid-auto-columns:1fr; grid-auto-flow:column; background:var(--sunk); border-radius:15px; padding:4px; gap:4px}
.seg button{border:0; background:transparent; min-height:44px; padding:8px 6px; border-radius:11px; font-weight:600; color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.1)}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{display:inline-flex; align-items:center; gap:6px; min-height:36px; padding:6px 13px; border-radius:99px; border:1px solid var(--line-strong); background:var(--surface); font-size:.9rem; font-weight:500; color:var(--ink)}
button.chip:hover{border-color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.chip.use{background:var(--ok-soft); border-color:transparent; color:var(--ok-ink); min-height:28px; padding:3px 10px; font-size:.82rem; font-weight:600}
.chip.miss{background:var(--danger-soft); border-color:transparent; color:var(--danger); min-height:28px; padding:3px 10px; font-size:.82rem; font-weight:600}
.hscroll{display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px; scroll-snap-type:x proximity}
.hscroll::-webkit-scrollbar{display:none}
.hscroll > *{flex:none; scroll-snap-align:start}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:18px; box-shadow:var(--shadow)}

/* ---------- cook page ---------- */
.cook-grid{display:grid; gap:16px; align-items:start}
@media (min-width:1100px){.cook-grid{grid-template-columns:380px minmax(0,1fr); gap:28px}.cook-grid .left{position:sticky; top:24px}}
.hero{background:linear-gradient(135deg, var(--hero-a), var(--hero-b)); color:var(--hero-ink); border-radius:24px; padding:20px; display:flex; flex-direction:column; gap:16px; box-shadow:var(--shadow)}
.hero h2{font-size:1.45rem}
.hero .seg{background:rgba(255,255,255,.5)}
.hero .seg button{color:var(--hero-ink-2)}
.hero .seg button[aria-pressed="true"]{background:#FFFFFF; color:var(--hero-ink)}
.hero .btn.go{background:var(--hero-ink); color:#FFFFFF; border-color:var(--hero-ink)}
.hero .hint{font-size:.85rem; color:var(--hero-ink-2); text-align:center}
.kit-card{display:flex; flex-direction:column; gap:12px}
.kit-top{display:flex; align-items:center; gap:12px}
.kit-count{font-family:var(--f-display); font-weight:750; font-size:2rem; line-height:1; font-variant-numeric:tabular-nums}
.kit-preview{display:flex; flex-wrap:wrap; gap:6px}
.kit-preview .chip{min-height:30px; padding:3px 11px; font-size:.84rem}

/* progress */
.progress{display:flex; flex-direction:column; gap:12px}
.step{display:flex; align-items:center; gap:12px; font-weight:600; color:var(--ink-3)}
.step .dot{width:26px; height:26px; border-radius:50%; border:2px solid var(--line-strong); display:grid; place-items:center; flex:none; font-size:.8rem}
.step.now{color:var(--ink)}
.step.now .dot{border-color:var(--leaf); border-top-color:transparent}
@media (prefers-reduced-motion:no-preference){.step.now .dot{animation:spin .8s linear infinite}}
@keyframes spin{to{transform:rotate(360deg)}}
.step.done{color:var(--ink-2)}
.step.done .dot{background:var(--ok); border-color:var(--ok); color:var(--ink)}
.skel{height:14px; border-radius:7px; background:var(--sunk)}
@media (prefers-reduced-motion:no-preference){.skel{animation:pulse 1.2s ease-in-out infinite}}
@keyframes pulse{50%{opacity:.45}}

/* meal cards */
.results{display:grid; gap:14px}
@media (min-width:768px) and (max-width:1099px){.results.two{grid-template-columns:1fr 1fr}}
.meal{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:18px; display:flex; flex-direction:column; gap:12px; box-shadow:var(--shadow)}
.meal-top{display:flex; gap:14px; align-items:flex-start}
.meal-ic{width:48px; height:48px; border-radius:14px; display:grid; place-items:center; flex:none; background:var(--haldi-soft); color:var(--haldi-ink)}
.meal-ic.lunch{background:var(--ok-soft); color:var(--ok-ink)}
.slot{font-family:var(--f-display); font-size:.72rem; font-weight:750; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3)}
.mins{display:inline-flex; align-items:center; gap:5px; font-size:.82rem; font-weight:600; color:var(--ink-2); margin-top:3px}
.why{color:var(--ink-2)}
.grounded{display:inline-flex; align-items:center; gap:6px; font-size:.8rem; font-weight:700; color:var(--ok-ink)}
.meal-actions .act{width:46px; height:46px; padding:0; border-radius:14px}
.meal-actions{display:flex; gap:8px; border-top:1px solid var(--line); padding-top:12px; align-items:center; flex-wrap:wrap}
.act{display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:44px; min-width:44px; border:1px solid var(--line); background:var(--surface); padding:8px 13px; border-radius:13px; font-size:.9rem; font-weight:600; color:var(--ink-2)}
.act:hover{border-color:var(--line-strong); color:var(--ink)}
.act[aria-pressed="true"].heart{background:var(--haldi-soft); border-color:var(--haldi); color:var(--haldi-ink)}
.act[aria-pressed="true"].up{background:var(--ok-soft); border-color:var(--ok); color:var(--ok-ink)}
.act[aria-pressed="true"].down{background:var(--danger-soft); border-color:var(--danger); color:var(--danger)}
.act[aria-pressed="true"] svg{fill:currentColor}
.why-not{display:flex; flex-direction:column; gap:8px; background:var(--sunk); border-radius:14px; padding:12px}
.notice{border-radius:var(--r); padding:18px; border:1px solid; display:flex; flex-direction:column; gap:10px}
.notice.warn{background:var(--haldi-soft); border-color:color-mix(in srgb, var(--haldi) 60%, transparent)}
.notice.err{background:var(--danger-soft); border-color:color-mix(in srgb, var(--danger) 50%, transparent)}
.placeholder{border:1.5px dashed var(--line-strong); border-radius:var(--r); padding:30px 20px; text-align:center; color:var(--ink-2); display:flex; flex-direction:column; align-items:center; gap:8px}
.remaining{font-size:.82rem; color:var(--ink-3); text-align:center}

/* ---------- kitchen page ---------- */
.k-tools{position:sticky; top:calc(env(safe-area-inset-top,0px)); z-index:5; background:var(--bg); padding-block:8px 10px; display:flex; flex-direction:column; gap:10px}
.group-h{display:flex; justify-content:space-between; align-items:baseline; margin:18px 4px 8px}
.rows{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
.irow{display:grid; grid-template-columns:minmax(0,1fr) auto auto 40px; gap:8px; align-items:center; padding:10px 8px 10px 16px; border-bottom:1px solid var(--line)}
.irow:last-child{border-bottom:0}
.irow .n{font-weight:600; overflow-wrap:anywhere; line-height:1.25}
.irow .a{display:block; font-size:.76rem; color:var(--ink-3); font-weight:400}
.stepper{display:inline-flex; align-items:center; border:1px solid var(--line-strong); border-radius:12px; background:var(--surface); overflow:hidden}
.stepper button{width:36px; height:40px; border:0; background:none; font-size:1.15rem; font-weight:600; color:var(--ink)}
.stepper button:hover{background:var(--sunk)}
.stepper input{width:46px; height:40px; font-size:.95rem; border:0; text-align:center; background:transparent; font-weight:600; font-variant-numeric:tabular-nums; -moz-appearance:textfield; padding:0}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none}
.stepper.lg button{width:46px; height:48px} .stepper.lg input{width:70px; height:48px}
.unit-sel{min-height:40px; padding:6px 8px; border-radius:12px; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); font-weight:600; font-size:.88rem}
.del{width:40px; height:40px; border-radius:12px; border:0; background:none; color:var(--ink-3); display:grid; place-items:center}
.del:hover{color:var(--danger); background:var(--danger-soft)}
@media (max-width:420px){
  .irow{grid-template-columns:minmax(0,1fr) auto auto 36px; gap:6px; padding:10px 6px 10px 12px}
  .irow .stepper button{width:30px} .irow .stepper input{width:40px; font-size:.9rem} .irow .unit-sel{padding:6px 4px; font-size:.84rem} .irow .del{width:36px}
}
@media (max-width:340px){
  .irow{grid-template-columns:minmax(0,1fr) 40px; grid-template-areas:"n d" "c c"; row-gap:8px}
  .irow .n{grid-area:n} .irow .del{grid-area:d} .irow .ctl{grid-area:c; display:flex; gap:8px}
  .irow .ctl .unit-sel{flex:1}
}
@media (min-width:341px){.irow .ctl{display:contents}}
@media (max-width:767px){#k-list{padding-bottom:72px}}
.add-ic{background:var(--leaf-soft); color:var(--leaf-ink); border-color:transparent; width:46px; height:46px; border-radius:14px}
.fab .fab-l{display:none}
@media (max-width:767px){.fab{width:60px; height:60px; min-height:60px; padding:0; border-radius:20px}}
@media (min-width:768px){.fab .fab-l{display:inline}}
.fab{position:fixed; z-index:25; right:16px; bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 16px); min-height:56px; padding:0 22px; border-radius:18px; box-shadow:0 8px 24px rgba(255,159,127,.45)}
@media (min-width:768px){.fab{position:static; box-shadow:none}}
.empty{text-align:center; padding:34px 20px; border:1.5px dashed var(--line-strong); border-radius:var(--r); color:var(--ink-2); display:flex; flex-direction:column; align-items:center; gap:12px}
.empty h2{color:var(--ink)}

/* ---------- saved ---------- */
.fav-grid{display:grid; gap:14px}
@media (min-width:768px){.fav-grid{grid-template-columns:1fr 1fr}}
@media (min-width:1300px){.fav-grid{grid-template-columns:1fr 1fr 1fr}}
.status{display:inline-flex; align-items:center; gap:6px; font-size:.82rem; font-weight:700; padding:4px 10px; border-radius:99px; width:max-content; max-width:100%}
.status.ok{background:var(--ok-soft); color:var(--ok-ink)}
.status.no{background:var(--sunk); color:var(--ink-2)}

/* ---------- add sheet ---------- */
.scrim{position:fixed; inset:0; background:rgba(10,15,12,.45); z-index:40; opacity:0; transition:opacity .2s}
.scrim.show{opacity:1}
.sheet{position:fixed; z-index:41; left:0; right:0; bottom:0; height:min(92vh, 900px); background:var(--surface); border-radius:24px 24px 0 0; box-shadow:var(--shadow-lg); display:flex; flex-direction:column; transform:translateY(100%); transition:transform .26s cubic-bezier(.2,.8,.2,1); padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.show{transform:none}
@media (min-width:768px){.sheet{left:50%; right:auto; bottom:auto; top:50%; width:min(780px, 92vw); height:min(86vh, 860px); border-radius:24px; transform:translate(-50%,-47%); opacity:0; transition:all .2s ease}.sheet.show{transform:translate(-50%,-50%); opacity:1}}
.grab{width:42px; height:5px; border-radius:99px; background:var(--line-strong); margin:10px auto 0; flex:none}
@media (min-width:768px){.grab{display:none}}
.sheet-head{padding:12px 18px 12px; display:flex; flex-direction:column; gap:12px; border-bottom:1px solid var(--line)}
.sheet-body{overflow-y:auto; padding:16px 18px 24px; flex:1; -webkit-overflow-scrolling:touch}
.sheet-foot{padding:12px 18px; border-top:1px solid var(--line); display:flex; align-items:center; gap:12px}
.tab{min-height:38px; padding:7px 14px; border-radius:99px; border:1px solid var(--line-strong); background:var(--surface); font-weight:600; font-size:.88rem; color:var(--ink-2); white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.tab .n{opacity:.7; font-weight:500; margin-left:4px; font-variant-numeric:tabular-nums}

<body>
<div class="app" id="app"></div>
<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden></section>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toast-msg"></span><button type="button" id="toast-act" hidden>Undo</button></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="ingredients.js"></script>
<script>
/* =========================================================
   DIRECTORY + SEARCH
   ========================================================= */
const ING = window.INGREDIENTS || [];
const ING_BY_NAME = Object.fromEntries(ING.map(i => [i.name.toLowerCase(), i]));
const CATEGORIES = [...new Set(ING.map(i => i.category))];
const CUSTOM_UNITS = ['pcs','g','kg','ml','L','packet'];
const POPULAR = ['Onion','Tomato','Potato','Garlic','Ginger','Green chilli','Coriander leaves','Lemon','Rice','Atta','Toor dal','Moong dal','Besan','Poha','Sooji','Milk','Curd','Paneer','Eggs','Bread','Butter','Ghee','Peanuts','Green peas'];
const PACKS = [
  {name: 'Everyday basics', items: ['Onion','Tomato','Potato','Garlic','Ginger','Green chilli','Rice','Atta','Toor dal','Curd']},
  {name: 'Breakfast shelf', items: ['Poha','Sooji','Besan','Bread','Eggs','Milk','Butter','Peanuts']}
];
const norm = s => String(s).toLowerCase().normalize('NFKD').replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
function searchIngredients(q){
  const n = norm(q); if (!n) return [];
  const out = [];
  for (const i of ING){
    const name = norm(i.name); let score = 0, via = null;
    if (name === n) score = 120; else if (name.startsWith(n)) score = 100; else if (name.split(' ').some(w => w.startsWith(n))) score = 85;
    for (const a of i.aliases){
      const an = norm(a); let s = 0;
      if (an === n) s = 110; else if (an.startsWith(n)) s = 75; else if (an.split(' ').some(w => w.startsWith(n))) s = 65; else if (an.includes(n)) s = 35;
      if (s > score){ score = s; via = a; }
    }
    if (!score && name.includes(n)) score = 45;
    if (score) out.push({i, score, via});
  }
  return out.sort((a, b) => b.score - a.score || a.i.name.length - b.i.name.length || a.i.name.localeCompare(b.i.name));
}

/* =========================================================
   DB — Supabase, with everything cached in memory after log-in.
   Changes update memory first, then save in order; a failed save shows a message.
   ========================================================= */
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Math.random().toString(36).slice(2) + Date.now());
const sb = (window.supabase && window.RASOI_CONFIG && window.RASOI_CONFIG.url) ? window.supabase.createClient(window.RASOI_CONFIG.url, window.RASOI_CONFIG.key) : null;
const C = {user: null, ingredients: [], suggestions: [], favourites: [], ratings: []};
let writeQ = Promise.resolve();
function save(fn){
  writeQ = writeQ.then(fn).then(res => { if (res && res.error) throw res.error; }).catch(e => { console.error('save failed', e); toast("Couldn't save that change. Check your connection and try again."); });
  return writeQ;
}
const local = {get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } }, set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }};
const mealFromRow = m => ({id: m.id, slot: m.slot, dish: m.dish, minutes: m.minutes, uses: m.uses || [], why: m.why});
const DB = {
  async load(session){
    const id = session.user.id;
    const [p, st, ing, sug, fav, rat] = await Promise.all([
      sb.from('profiles').select('*').eq('id', id).maybeSingle(),
      sb.from('user_staples').select('name').eq('user_id', id),
      sb.from('user_ingredients').select('*').eq('user_id', id).order('created_at'),
      sb.from('suggestions').select('id, slot, possible, reason, unlock_ingredient, nearest_dish, nearest_missing, created_at, suggestion_meals(*)').eq('user_id', id).order('created_at', {ascending: false}).limit(30),
      sb.from('favourites').select('id, created_at, meal_id, suggestion_meals(*)').eq('user_id', id).order('created_at', {ascending: false}),
      sb.from('meal_ratings').select('meal_id, value, comment').eq('user_id', id)
    ]);
    const err = [p, st, ing, sug, fav, rat].find(r => r.error); if (err) throw err.error;
    const prof = p.data || {name: (session.user.user_metadata || {}).name || session.user.email.split('@')[0], email: session.user.email, diet: 'veg'};
    C.user = {id, name: prof.name, email: prof.email || session.user.email, diet: prof.diet, staples: st.data.map(r => r.name)};
    C.ingredients = ing.data.map(r => ({id: r.id, catalog_id: r.catalog_id, name: r.name, category: r.category, quantity: r.quantity == null ? null : Number(r.quantity), unit: r.unit, created_at: r.created_at}));
    C.suggestions = sug.data.map(s => {
      const meals = (s.suggestion_meals || []).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
      const latest = ['breakfast', 'lunch'].map(sl => meals.find(m => m.slot === sl)).filter(Boolean).map(mealFromRow);   // after "Show another", the newest meal per slot is the one shown
      return {id: s.id, slot: s.slot, possible: s.possible, reason: s.reason, unlock: s.unlock_ingredient, nearest_dish: s.nearest_dish, nearest_missing: s.nearest_missing || [], created_at: s.created_at, meals: latest};
    });
    C.favourites = fav.data.filter(f => f.suggestion_meals).map(f => ({...mealFromRow(f.suggestion_meals), id: f.id, meal_id: f.meal_id, created_at: f.created_at}));
    C.ratings = rat.data;
  },
  currentUser(){ return C.user; },
  async signUp(name, email, pw){
    const {data, error} = await sb.auth.signUp({email, password: pw, options: {data: {name}, emailRedirectTo: location.origin}});
    if (error) throw new Error(/registered|exists/i.test(error.message) ? 'exists' : error.message);
    if (data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) throw new Error('exists');
    if (!data.session) return {confirm: true};
    await this.load(data.session); return {confirm: false};
  },
  async logIn(email, pw){
    const {data, error} = await sb.auth.signInWithPassword({email, password: pw});
    if (error) throw new Error(/confirm/i.test(error.message) ? 'unconfirmed' : /invalid/i.test(error.message) ? 'invalid' : error.message);
    await this.load(data.session);
  },
  async resetPassword(email){ const {error} = await sb.auth.resetPasswordForEmail(email, {redirectTo: location.origin}); if (error) throw error; },
  async setNewPassword(pw){ const {error} = await sb.auth.updateUser({password: pw}); if (error) throw error; },
  async signOut(){ await sb.auth.signOut(); Object.assign(C, {user: null, ingredients: [], suggestions: [], favourites: [], ratings: []}); },
  updateProfile(patch){
    const u = C.user; Object.assign(u, patch);
    if ('name' in patch || 'diet' in patch){ const row = {}; if ('name' in patch) row.name = patch.name; if ('diet' in patch) row.diet = patch.diet; save(() => sb.from('profiles').update(row).eq('id', u.id)); }
    if ('staples' in patch) save(async () => { const d = await sb.from('user_staples').delete().eq('user_id', u.id); if (d.error) return d; return patch.staples.length ? sb.from('user_staples').insert(patch.staples.map(name => ({user_id: u.id, name}))) : null; });
    return u;
  },
  ingredients(){ return C.ingredients; },
  has(name){ return C.ingredients.some(i => i.name.toLowerCase() === String(name).toLowerCase()); },
  _row(i){ return {id: i.id, user_id: C.user.id, catalog_id: i.catalog_id, name: i.name, category: i.category, quantity: i.quantity, unit: i.unit}; },
  addIngredient(name, qty, unit){
    const meta = ING_BY_NAME[String(name).toLowerCase()]; const allowed = meta ? meta.allowed_units : CUSTOM_UNITS;
    unit = allowed.includes(unit) ? unit : allowed[0];
    let row = C.ingredients.find(i => i.name.toLowerCase() === String(name).toLowerCase());
    if (row){
      if (qty != null && qty !== '') row.quantity = Number(qty); row.unit = unit;
      save(() => sb.from('user_ingredients').update({quantity: row.quantity, unit: row.unit, updated_at: new Date().toISOString()}).eq('id', row.id));
      return {row, updated: true};
    }
    row = {id: uid(), catalog_id: meta ? meta.id : null, name: meta ? meta.name : String(name).trim().replace(/^./, c => c.toUpperCase()), category: meta ? meta.category : 'Others', quantity: qty == null || qty === '' ? null : Number(qty), unit, created_at: new Date().toISOString()};
    C.ingredients.push(row); save(() => sb.from('user_ingredients').insert(this._row(row)));
    return {row, updated: false};
  },
  restoreIngredient(row){ if (this.has(row.name)) return; C.ingredients.push(row); save(() => sb.from('user_ingredients').insert(this._row(row))); },
  updateIngredient(id, patch){ const r = C.ingredients.find(i => i.id === id); if (!r) return; Object.assign(r, patch); save(() => sb.from('user_ingredients').update({...patch, updated_at: new Date().toISOString()}).eq('id', id)); },
  removeIngredient(id){ const row = C.ingredients.find(i => i.id === id); C.ingredients = C.ingredients.filter(i => i.id !== id); save(() => sb.from('user_ingredients').delete().eq('id', id)); return row; },
  removeByName(name){ const row = C.ingredients.find(i => i.name.toLowerCase() === name.toLowerCase()); if (row) this.removeIngredient(row.id); return row; },
  setIngredients(list){ C.ingredients = list.slice(); save(async () => { const d = await sb.from('user_ingredients').delete().eq('user_id', C.user.id); if (d.error || !list.length) return d; return sb.from('user_ingredients').insert(list.map(i => this._row(i))); }); },
  suggestions(){ return C.suggestions; },
  lastSuggestion(){ return C.suggestions[0] || null; },
  addMealVariant(suggestionId, meal){ save(() => sb.from('suggestion_meals').insert({id: meal.id, suggestion_id: suggestionId, user_id: C.user.id, slot: meal.slot, dish: meal.dish, why: meal.why, minutes: meal.minutes, uses: meal.uses})); },
  favourites(){ return C.favourites; },
  isFavourite(mealId){ return C.favourites.some(f => f.meal_id === mealId); },
  toggleFavourite(meal){
    const f = C.favourites.find(x => x.meal_id === meal.id);
    if (f){ this.removeFavourite(f.id); return false; }
    const nf = {id: uid(), meal_id: meal.id, dish: meal.dish, slot: meal.slot, minutes: meal.minutes, uses: meal.uses, why: meal.why, created_at: new Date().toISOString()};
    C.favourites.unshift(nf); save(() => sb.from('favourites').insert({id: nf.id, user_id: C.user.id, meal_id: meal.id}));
    return true;
  },
  removeFavourite(id){ const f = C.favourites.find(x => x.id === id); C.favourites = C.favourites.filter(x => x.id !== id); save(() => sb.from('favourites').delete().eq('id', id)); return f; },
  restoreFavourite(f){ C.favourites.unshift(f); save(() => sb.from('favourites').insert({id: f.id, user_id: C.user.id, meal_id: f.meal_id})); },
  rating(mealId){ const r = C.ratings.find(x => x.meal_id === mealId); return r ? r.value : 0; },
  rate(meal, value, comment){
    C.ratings = C.ratings.filter(x => x.meal_id !== meal.id);
    if (value){ C.ratings.push({meal_id: meal.id, value, comment: comment || null}); save(() => sb.from('meal_ratings').upsert({user_id: C.user.id, meal_id: meal.id, value, comment: comment || null}, {onConflict: 'user_id,meal_id'})); }
    else save(() => sb.from('meal_ratings').delete().eq('user_id', C.user.id).eq('meal_id', meal.id));
  },
  deleteMyData(){ const id = C.user.id; C.ingredients = []; C.suggestions = []; C.favourites = []; C.ratings = []; save(async () => { const a = await sb.from('user_ingredients').delete().eq('user_id', id); if (a.error) return a; return sb.from('suggestions').delete().eq('user_id', id); }); }
};

/* =========================================================
   AI — the Supabase function "suggest" reads this user's kitchen from
   the database, calls Gemini with the secret key, checks the answer,
   saves it, and returns one dish per meal plus spares.
   ========================================================= */
const AI = {
  async suggest({slot, avoid}){
    const {data, error} = await sb.functions.invoke('suggest', {body: {slot, avoid}});
    if (error){
      let msg = 'Something went wrong. Try again.';
      try { const j = await error.context.json(); if (j && j.error) msg = j.error; } catch(e){ if (/fetch|network|Failed/i.test(String(error.message))) msg = "Can't reach Rasoi. Check your internet connection."; }
      throw new Error(msg);
    }
    return data;
  }
};

/* =========================================================
   HELPERS
   ========================================================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const ui = {slot: null, loading: false, stage: 0, error: null, result: null, remaining: null, alts: {}, downOpen: null, savedFilter: 'all', kitFilter: '', kitCat: 'All'};
function defaultSlot(){ const h = new Date().getHours(); return h < 11 ? 'breakfast' : h < 16 ? 'lunch' : 'both'; }
function greeting(){ const h = new Date().getHours(); return h >= 5 && h < 12 ? 'Good morning' : h < 17 && h >= 12 ? 'Good afternoon' : 'Good evening'; }
function fmtQty(i){ return i.quantity != null ? `${+i.quantity} ${i.unit}` : ''; }
let toastT;
function toast(msg, action){
  const t = $('#toast'), b = $('#toast-act');
  $('#toast-msg').textContent = msg; b.hidden = !action; t.classList.toggle('plain', !action); b.onclick = null;
  if (action){ b.textContent = action.label || 'Undo'; b.onclick = () => { action.run(); t.classList.remove('show'); }; }
  t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), action ? 5000 : 2200);
}
const I = (p, s = 22, w = 1.9) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const ICON = {
  pot: I('<path d="M3.5 11h17a8.5 8.5 0 0 1-17 0Z"/><path d="M9 7.5c0-1.5 1-2 1-3.5M14 7.5c0-1.5 1-2 1-3.5"/>'),
  basket: I('<path d="M3 10h18"/><path d="M5 10v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>'),
  heart: I('<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"/>', 18, 2),
  heartNav: I('<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"/>'),
  user: I('<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>'),
  up: I('<path d="M7 11v9H4v-9h3Zm0 0 4-8a2 2 0 0 1 2 2v4h5.5a2 2 0 0 1 2 2.3l-1.2 7A2 2 0 0 1 17.3 20H7"/>', 18, 2),
  down: I('<path d="M7 13V4H4v9h3Zm0 0 4 8a2 2 0 0 0 2-2v-4h5.5a2 2 0 0 0 2-2.3l-1.2-7A2 2 0 0 0 17.3 4H7"/>', 18, 2),
  shuffle: I('<path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>', 18, 2),
  search: I('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>', 20, 2),
  plus: I('<path d="M12 5v14M5 12h14"/>', 20, 2.4),
  trash: I('<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>', 19),
  close: I('<path d="M6 6l12 12M18 6 6 18"/>', 20, 2.2),
  clock: I('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', 15, 2.2),
  check: I('<path d="m5 12 5 5 9-10"/>', 15, 2.6),
  sun: I('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'),
  bowl: I('<path d="M3 11h18a9 9 0 0 1-18 0Z"/><path d="M7 7c1-1 2.5-1 3.5 0M13.5 7c1-1 2.5-1 3.5 0"/>')
};
const LOGO = `<span class="logo-mark">${I('<path d="M3.5 11h17a8.5 8.5 0 0 1-17 0Z"/><path d="M9 7.5c0-1.5 1-2 1-3.5M14 7.5c0-1.5 1-2 1-3.5"/>', 22, 2)}</span>`;

/* =========================================================
   SHELL
   ========================================================= */
function shell(route){
  const nIng = DB.ingredients().length, nFav = DB.favourites().length;
  const tab = (r, href, icon, label, badge) => `<a href="${href}" ${route === r ? 'aria-current="page"' : ''}><span class="ic">${icon}</span><span>${label}</span>${badge !== undefined ? `<span class="badge ${r === 'saved' ? 'fav' : ''}" id="b-${r}">${badge || ''}</span>` : ''}</a>`;
  $('#app').innerHTML = `
    <nav class="nav" aria-label="Main">
      <div class="brand">${LOGO}<b>Rasoi</b></div>
      ${tab('cook', '#/', ICON.pot, 'Cook')}
      ${tab('kitchen', '#/kitchen', ICON.basket, 'Kitchen', nIng)}
      ${tab('saved', '#/saved', ICON.heartNav, 'Saved', nFav)}
      ${tab('profile', '#/profile', ICON.user, 'Profile')}
    </nav>
    <main class="main" id="view"></main>`;
}
function badges(){ const k = $('#b-kitchen'), s = $('#b-saved'); if (k) k.textContent = DB.ingredients().length || ''; if (s) s.textContent = DB.favourites().length || ''; }
const view = () => $('#view');

/* =========================================================
   AUTH
   ========================================================= */
function authShell(inner){ $('#app').innerHTML = `<section class="auth"><div class="auth-box"><div class="brand">${LOGO}<b>Rasoi</b></div>${inner}</div></section>`; }
const pwField = (id, label, auto) => `<div class="field"><label for="${id}">${label}</label><div class="pw"><input class="input" id="${id}" type="password" autocomplete="${auto}" required minlength="8"><button type="button" data-showpw="${id}" aria-label="Show password">Show</button></div></div>`;
function bindPw(){ document.querySelectorAll('[data-showpw]').forEach(b => b.addEventListener('click', () => { const i = $('#' + b.dataset.showpw); const show = i.type === 'password'; i.type = show ? 'text' : 'password'; b.textContent = show ? 'Hide' : 'Show'; b.setAttribute('aria-label', show ? 'Hide password' : 'Show password'); })); }

function renderSignup(){
  authShell(`<div class="stack" style="gap:8px"><h1>Never wonder what to cook again</h1><p class="muted">Tell Rasoi what's in your kitchen. It suggests breakfast and lunch using only what you have.</p></div>
  <form class="card stack" id="f" novalidate>
    <div class="field"><label for="su-name">Your name</label><input class="input" id="su-name" autocomplete="given-name" required placeholder="Shubham"></div>
    <div class="field"><label for="su-email">Email</label><input class="input" id="su-email" type="email" autocomplete="email" inputmode="email" required placeholder="you@example.com"></div>
    ${pwField('su-pw', 'Password', 'new-password')}
    <div class="meter" aria-hidden="true"><i id="meter"></i></div><p class="tiny muted" id="meter-text" style="margin-top:-8px">At least 8 characters.</p>
    <p class="err-text" id="err" role="alert" hidden></p>
    <button class="btn leaf big block" type="submit">Create account</button>
  </form>
  <p class="switch-auth">Already have an account? <a href="#/login">Log in</a></p>`);
  bindPw();
  $('#su-pw').addEventListener('input', e => {
    const v = e.target.value; let s = 0; if (v.length >= 8) s++; if (/[A-Z]/.test(v) && /[a-z]/.test(v)) s++; if (/\d/.test(v)) s++; if (/[^A-Za-z0-9]/.test(v) || v.length >= 12) s++;
    const m = $('#meter'); m.style.width = (s / 4 * 100) + '%'; m.style.background = s < 2 ? 'var(--danger)' : s < 3 ? 'var(--haldi)' : 'var(--leaf)';
    $('#meter-text').textContent = v.length < 8 ? `At least 8 characters (${v.length}/8).` : ['Weak','Weak','Okay','Good','Strong'][s] + ' password.';
  });
  $('#f').addEventListener('submit', async e => {
    e.preventDefault(); const err = $('#err');
    const name = $('#su-name').value.trim(), email = $('#su-email').value.trim(), pw = $('#su-pw').value;
    const fail = m => { err.textContent = m; err.hidden = false; };
    if (!name) return fail('Enter your name.');
    if (!/^\S+@\S+\.\S+$/.test(email)) return fail('Enter a valid email address.');
    if (pw.length < 8) return fail('Use a password of at least 8 characters.');
    const btn = $('#f button[type=submit]'); btn.disabled = true; btn.textContent = 'Creating account…';
    try {
      const r = await DB.signUp(name, email, pw);
      if (r.confirm) return renderCheckEmail(email);
      location.hash = '#/welcome';
    } catch(x){
      btn.disabled = false; btn.textContent = 'Create account';
      if (x.message === 'exists'){ err.innerHTML = 'An account with this email already exists. <a href="#/login">Log in instead</a>.'; err.hidden = false; }
      else fail(x.message && x.message.length < 140 ? x.message : 'Something went wrong. Try again.');
    }
  });
}
function renderLogin(){
  authShell(`<div class="stack" style="gap:8px"><h1>Welcome back</h1><p class="muted">Log in to see your kitchen and today's suggestion.</p></div>
  <form class="card stack" id="f" novalidate>
    <div class="field"><label for="li-email">Email</label><input class="input" id="li-email" type="email" autocomplete="email" inputmode="email" required placeholder="you@example.com"></div>
    ${pwField('li-pw', 'Password', 'current-password')}
    <p class="err-text" id="err" role="alert" hidden></p>
    <button class="btn leaf big block" type="submit">Log in</button>
    <button class="btn ghost" type="button" id="forgot">Forgot password?</button>
  </form>
  <p class="switch-auth">New to Rasoi? <a href="#/signup">Create an account</a></p>`);
  bindPw();
  $('#forgot').addEventListener('click', async () => {
    const email = $('#li-email').value.trim(); const err = $('#err');
    if (!/^\S+@\S+\.\S+$/.test(email)){ err.textContent = 'Enter your email above, then tap Forgot password.'; err.hidden = false; $('#li-email').focus(); return; }
    try { await DB.resetPassword(email); err.hidden = true; toast('Check your email for a link to reset your password'); }
    catch(x){ err.textContent = /rate/i.test(x.message) ? 'Too many emails sent. Wait a few minutes and try again.' : x.message; err.hidden = false; }
  });
  $('#f').addEventListener('submit', async e => {
    e.preventDefault(); const err = $('#err'); const btn = $('#f button[type=submit]'); btn.disabled = true; btn.textContent = 'Logging in…';
    try { await DB.logIn($('#li-email').value.trim(), $('#li-pw').value); location.hash = DB.ingredients().length ? '#/' : '#/welcome'; route(); }
    catch(x){ btn.disabled = false; btn.textContent = 'Log in'; err.hidden = false;
      err.innerHTML = x.message === 'invalid' ? 'Email or password is incorrect. New here? <a href="#/signup">Create an account</a>.' : x.message === 'unconfirmed' ? 'Confirm your email first. Check your inbox for the link we sent.' : 'Something went wrong. Try again.'; }
  });
}
function renderCheckEmail(email){ authShell(`<div class="card stack"><h1>Check your email</h1><p>We sent a confirmation link to <b>${esc(email)}</b>. Open it on this device, then come back and log in.</p><a class="btn leaf block" href="#/login">Go to log in</a></div>`); }
function renderNewPassword(){
  authShell(`<h1>Set a new password</h1><form class="card stack" id="f" novalidate>${pwField('np-pw', 'New password', 'new-password')}<p class="err-text" id="err" role="alert" hidden></p><button class="btn leaf big block" type="submit">Save password</button></form>`);
  bindPw();
  $('#f').addEventListener('submit', async e => { e.preventDefault(); const pw = $('#np-pw').value; const err = $('#err');
    if (pw.length < 8){ err.textContent = 'Use at least 8 characters.'; err.hidden = false; return; }
    try { await DB.setNewPassword(pw); recovering = false; toast('Password updated'); location.hash = '#/'; route(); } catch(x){ err.textContent = x.message; err.hidden = false; } });
}

/* =========================================================
   WELCOME — 3 steps: preference, stock kitchen, first suggestion
   ========================================================= */
let wStep = 1;
function renderWelcome(){
  const u = DB.currentUser(); const n = DB.ingredients().length;
  const dots = `<div class="dots" aria-label="Step ${wStep} of 3">${[1,2,3].map(i => `<i class="${i <= wStep ? 'on' : ''}"></i>`).join('')}</div>`;
  let body = '', foot = '';
  if (wStep === 1){
    body = `<div class="stack"><p class="label">Step 1 of 3</p><h1>Hi ${esc(u.name)}. What do you eat?</h1><p class="muted">Suggestions never include anything outside this. You can change it later.</p></div>
      <div class="diet" role="group" aria-label="Food preference">${[['veg','Vegetarian','No egg, meat or fish'],['egg','Eggetarian','Vegetarian plus eggs'],['nonveg','Non-vegetarian','Anything goes']].map(([k, t, d]) => `<button type="button" data-diet="${k}" aria-pressed="${u.diet === k}"><b>${t}</b><span class="small muted">${d}</span></button>`).join('')}</div>`;
    foot = `<button class="btn ghost" data-skip>Skip</button><span class="spacer"></span><button class="btn leaf" data-next>Continue</button>`;
  } else if (wStep === 2){
    body = `<div class="stack"><p class="label">Step 2 of 3</p><h1>What's in your kitchen?</h1><p class="muted">Tap what you have. Every ingredient unlocks more dishes. Quantities are optional and can be added later.</p></div>
      <div id="w-picker"></div>`;
    foot = `<span class="small muted" id="w-count"><b style="color:var(--ink)">${n}</b> added</span><span class="spacer"></span><button class="btn leaf" data-next ${n < 2 ? 'disabled' : ''}>${n < 2 ? 'Add at least 2' : 'Continue'}</button>`;
  } else {
    body = `<div class="stack"><p class="label">Step 3 of 3</p><h1>You're set.</h1><p class="muted">${n} ingredients in your kitchen, plus staples like salt, oil and haldi. Rasoi suggests dishes that use only these.</p></div>
      <div class="card stack"><b>Good to know</b><p class="small muted">Suggestions take 5 to 15 seconds while the AI checks every ingredient. Tap <b>Show another</b> on a dish to swap it instantly, and the heart to save it.</p></div>`;
    foot = `<span class="spacer"></span><button class="btn leaf big" data-first>Suggest my first meal</button>`;
  }
  $('#app').innerHTML = `<section class="welcome" style="padding-inline:16px"><div class="stack" style="gap:22px">${dots}${body}</div></section><div class="welcome-foot"><div>${foot}</div></div>`;
  document.querySelectorAll('[data-diet]').forEach(b => b.addEventListener('click', () => { DB.updateProfile({diet: b.dataset.diet}); renderWelcome(); }));
  const next = document.querySelector('[data-next]'); if (next) next.addEventListener('click', () => { wStep++; renderWelcome(); window.scrollTo(0, 0); });
  const skip = document.querySelector('[data-skip]'); if (skip) skip.addEventListener('click', () => { wStep = 2; renderWelcome(); });
  const first = document.querySelector('[data-first]'); if (first) first.addEventListener('click', () => { local.set('rasoi:onboarded:' + u.id, true); wStep = 1; location.hash = '#/'; setTimeout(suggest, 50); });
  if (wStep === 2){
    picker.mount($('#w-picker'), {inline: true, onChange: () => {
      const k = DB.ingredients().length; $('#w-count').innerHTML = `<b style="color:var(--ink)">${k}</b> added`;
      const b = document.querySelector('[data-next]'); b.disabled = k < 2; b.textContent = k < 2 ? 'Add at least 2' : 'Continue';
    }});
  }
}

/* =========================================================
   PICKER — one component for adding ingredients:
   search with optional quantity, or browse category tiles.
   Used inside the Add sheet and on the welcome screen.
   ========================================================= */
const picker = {
  el: null, opts: {}, q: '', tab: 'Popular', open: null,
  mount(el, opts){ this.el = el; this.opts = opts || {}; this.q = ''; this.tab = 'Popular'; this.open = null; this.draw(); },
  changed(){ badges(); if (this.opts.onChange) this.opts.onChange(); },
  draw(focus){
    const have = new Set(DB.ingredients().map(i => i.name.toLowerCase()));
    const count = c => c === 'Popular' ? POPULAR.filter(n => have.has(n.toLowerCase())).length : ING.filter(i => i.category === c && have.has(i.name.toLowerCase())).length;
    const searchBox = `<div class="search"><span class="s-ic">${ICON.search}</span><input class="input" id="pk-q" type="search" placeholder="Search ${ING.length} ingredients, e.g. pyaz, dahi" value="${esc(this.q)}" autocomplete="off" aria-label="Search ingredients" enterkeyhint="search"></div>`;
    let body;
    if (this.q.trim()){
      const res = searchIngredients(this.q).slice(0, 40);
      const exact = res.some(r => r.i.name.toLowerCase() === this.q.trim().toLowerCase() || r.i.aliases.some(a => a.toLowerCase() === this.q.trim().toLowerCase()));
      const hl = n => { const i = n.toLowerCase().indexOf(this.q.trim().toLowerCase()); return i < 0 ? esc(n) : esc(n.slice(0, i)) + '<mark>' + esc(n.slice(i, i + this.q.trim().length)) + '</mark>' + esc(n.slice(i + this.q.trim().length)); };
      const items = res.map(r => r.i);
      if (!exact) items.push({name: this.q.trim().replace(/^./, c => c.toUpperCase()), category: 'Others', allowed_units: CUSTOM_UNITS, default_unit: 'pcs', aliases: [], custom: true});
      body = `<ul class="res" role="list">${items.map((it, n) => {
        const inK = have.has(it.name.toLowerCase()); const isOpen = this.open === it.name; const via = (res[n] && res[n].via) || '';
        return `<li class="res-item ${isOpen ? 'open' : ''}"><button type="button" class="res-btn" data-pick="${esc(it.name)}" aria-expanded="${isOpen}">
          <span style="flex:1; min-width:0"><span class="rn">${it.custom ? '+ Add “' + esc(it.name) + '”' : hl(it.name)}</span><br><span class="rs">${it.custom ? 'Not in our list · added as your own item' : (via ? esc(via) + ' · ' : '') + esc(it.category)}</span></span>
          ${inK ? '<span class="have">In kitchen</span>' : ''}</button>
          ${isOpen ? this.qtyPanel(it) : ''}</li>`; }).join('')}</ul>`;
    } else {
      const tabs = ['Popular', ...CATEGORIES];
      const items = this.tab === 'Popular' ? POPULAR.map(n => ING_BY_NAME[n.toLowerCase()]) : ING.filter(i => i.category === this.tab);
      body = `<div class="hscroll" role="tablist" aria-label="Categories" style="margin-bottom:14px">${tabs.map(t => { const n = count(t); return `<button class="tab" role="tab" aria-selected="${t === this.tab}" data-tab="${esc(t)}">${esc(t)}${n ? `<span class="n">${n}</span>` : ''}</button>`; }).join('')}</div>
        ${this.tab === 'Popular' ? PACKS.map((pk, n) => { const miss = pk.items.filter(x => !have.has(x.toLowerCase())).length; return `<div class="pack"><div><b>${pk.name}</b><div class="tiny muted">${pk.items.join(', ')}</div></div><button class="btn sm ${miss ? 'solid' : ''}" type="button" data-pk="${n}" ${miss ? '' : 'disabled'}>${miss ? `Add ${miss}` : 'All added'}</button></div>`; }).join('') : ''}
        <div class="tiles">${items.map(i => { const on = have.has(i.name.toLowerCase()); return `<button type="button" class="tile" data-tile="${esc(i.name)}" aria-pressed="${on}"><span class="t-n">${esc(i.name)}</span>${i.aliases[0] ? `<span class="t-a">${esc(i.aliases[0])}</span>` : ''}<span class="t-m" aria-hidden="true">${on ? '✓' : '+'}</span></button>`; }).join('')}</div>`;
    }
    this.el.innerHTML = `<div class="stack" style="gap:14px">${searchBox}<div id="pk-body">${body}</div></div>`;
    const qi = $('#pk-q');
    qi.addEventListener('input', () => { this.q = qi.value; this.open = null; this.draw(true); });
    qi.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); const first = this.el.querySelector('[data-pick]'); if (first) first.click(); } });
    if (focus){ const n = $('#pk-q'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
    this.el.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => { this.tab = b.dataset.tab; this.draw(); const a = this.el.querySelector('.tab[aria-selected="true"]'); if (a) a.scrollIntoView({inline: 'center', block: 'nearest'}); }));
    this.el.querySelectorAll('[data-pk]').forEach(b => b.addEventListener('click', () => addPack(PACKS[Number(b.dataset.pk)], () => { this.draw(); this.changed(); })));
    this.el.querySelectorAll('[data-tile]').forEach(b => b.addEventListener('click', () => {
      const n = b.dataset.tile;
      if (DB.has(n)){ const row = DB.removeByName(n); toast(`Removed ${n}`, {run: () => { DB.restoreIngredient(row); this.draw(); this.changed(); }}); }
      else { DB.addIngredient(n, '', ING_BY_NAME[n.toLowerCase()].default_unit); toast(`Added ${n}`); }
      const on = DB.has(n); b.setAttribute('aria-pressed', on); b.querySelector('.t-m').textContent = on ? '✓' : '+';
      this.changed();
    }));
    this.el.querySelectorAll('[data-pick]').forEach(b => b.addEventListener('click', () => { this.open = this.open === b.dataset.pick ? null : b.dataset.pick; this.draw(); const qn = this.el.querySelector('.qty-panel input'); if (qn) qn.focus({preventScroll: true}); }));
    const panel = this.el.querySelector('.qty-panel'); if (panel) this.bindQty(panel);
  },
  qtyPanel(it){
    const ex = DB.ingredients().find(i => i.name.toLowerCase() === it.name.toLowerCase());
    const unit = ex ? ex.unit : it.default_unit; const qty = ex && ex.quantity != null ? ex.quantity : '';
    return `<div class="qty-panel" data-name="${esc(it.name)}" data-custom="${it.custom ? 1 : ''}">
      <div class="stepper lg"><button type="button" data-step="-1" aria-label="Less">−</button><input type="number" inputmode="decimal" min="0" step="any" value="${qty}" placeholder="Qty" aria-label="Quantity (optional)"><button type="button" data-step="1" aria-label="More">+</button></div>
      <div class="units" role="group" aria-label="Unit">${it.allowed_units.map(u => `<button type="button" class="unit" data-unit="${u}" aria-pressed="${u === unit}">${u}</button>`).join('')}</div>
      <button class="btn leaf" type="button" data-add style="margin-left:auto">${ex ? 'Update' : 'Add'}</button></div>`;
  },
  bindQty(panel){
    const name = panel.dataset.name; const qi = panel.querySelector('input'); let unit = panel.querySelector('[aria-pressed="true"]').dataset.unit;
    const step = u => ({g: 50, kg: .5, ml: 100, L: .5, tsp: 1, tbsp: 1, pinch: 1}[u] || 1);
    panel.querySelectorAll('[data-unit]').forEach(b => b.addEventListener('click', () => { unit = b.dataset.unit; panel.querySelectorAll('[data-unit]').forEach(x => x.setAttribute('aria-pressed', x === b)); }));
    panel.querySelectorAll('[data-step]').forEach(b => b.addEventListener('click', () => { const v = Math.max(0, (Number(qi.value) || 0) + step(unit) * Number(b.dataset.step)); qi.value = v ? +v.toFixed(2) : ''; }));
    const add = () => {
      const {row, updated} = DB.addIngredient(name, qi.value, unit);
      toast(`${updated ? 'Updated' : 'Added'} ${row.name}${row.quantity != null ? ' · ' + fmtQty(row) : ''}`, updated ? null : {run: () => { DB.removeIngredient(row.id); this.draw(); this.changed(); }});
      this.q = ''; this.open = null; this.draw(true); this.changed();
    };
    panel.querySelector('[data-add]').addEventListener('click', add);
    qi.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); add(); } });
  }
};
function addPack(pack, after){
  const added = pack.items.filter(n => !DB.has(n)).map(n => DB.addIngredient(n, '', ING_BY_NAME[n.toLowerCase()].default_unit).row);
  if (after) after();
  if (!added.length) return toast(`You already have everything in ${pack.name.toLowerCase()}`);
  toast(`Added ${added.length} from ${pack.name.toLowerCase()}`, {run: () => { added.forEach(r => DB.removeIngredient(r.id)); if (after) after(); }});
}

/* ---------- Add sheet ---------- */
let sheetReturn = null;
function openAdd(){
  sheetReturn = document.activeElement;
  const sh = $('#sheet'), sc = $('#scrim');
  sh.innerHTML = `<div class="grab" aria-hidden="true"></div>
    <div class="sheet-head"><div class="row-flex"><div class="spacer"><h2 id="sheet-title">Add ingredients</h2></div><button class="icon-btn" type="button" id="sheet-x" aria-label="Close">${ICON.close}</button></div></div>
    <div class="sheet-body" id="sheet-body"></div>
    <div class="sheet-foot"><span class="small muted"><b style="color:var(--ink)" id="sheet-n">${DB.ingredients().length}</b> in your kitchen</span><span class="spacer"></span><button class="btn leaf" type="button" id="sheet-done">Done</button></div>`;
  sh.hidden = false; sc.hidden = false; document.body.classList.add('sheet-open'); document.body.style.overflow = 'hidden';
  picker.mount($('#sheet-body'), {onChange: () => { $('#sheet-n').textContent = DB.ingredients().length; }});
  requestAnimationFrame(() => { sh.classList.add('show'); sc.classList.add('show'); });
  $('#sheet-x').addEventListener('click', closeAdd); $('#sheet-done').addEventListener('click', closeAdd);
  setTimeout(() => { if (innerWidth >= 768) $('#pk-q').focus(); else $('#sheet-x').focus(); }, 80);
}
function closeAdd(){
  const sh = $('#sheet'), sc = $('#scrim'); if (sh.hidden) return;
  sh.classList.remove('show'); sc.classList.remove('show'); document.body.classList.remove('sheet-open'); document.body.style.overflow = '';
  setTimeout(() => { sh.hidden = true; sc.hidden = true; sh.innerHTML = ''; }, reduce ? 0 : 260);
  route(true); if (sheetReturn && document.contains(sheetReturn)) sheetReturn.focus();
}
$('#scrim').addEventListener('click', closeAdd);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAdd(); });

/* =========================================================
   COOK
   ========================================================= */
function renderCook(){
  const u = DB.currentUser(); const ings = DB.ingredients();
  if (!ui.slot) ui.slot = defaultSlot();
  if (!ui.result && !ui.loading){ const last = DB.lastSuggestion(); if (last && Date.now() - new Date(last.created_at) < 10 * 3600e3) ui.result = last; }
  const preview = ings.slice(-6).reverse();
  view().innerHTML = `<div class="page wide">
    <header class="page-head"><div><h1>${greeting()}, ${esc(u.name)}</h1><p class="muted">Let's find something you can make right now.</p></div></header>
    <div class="cook-grid">
      <div class="left stack">
        <section class="hero" aria-labelledby="cook-h">
          <h2 id="cook-h">What should I cook?</h2>
          <div class="seg" role="group" aria-label="Meal">${[['breakfast','Breakfast'],['lunch','Lunch'],['both','Both']].map(([k, l]) => `<button type="button" data-slot="${k}" aria-pressed="${ui.slot === k}">${l}</button>`).join('')}</div>
          <button class="btn big block go" id="go" ${ings.length < 2 || ui.loading ? 'disabled' : ''}>${ui.loading ? 'Finding dishes…' : 'Suggest food'}</button>
          <p class="hint">${ings.length < 2 ? `Add ${2 - ings.length} more ingredient${ings.length === 1 ? '' : 's'} to start.` : `Uses only your ${ings.length} ingredients and staples.`}</p>
        </section>
        <section class="card kit-card" aria-label="Your kitchen">
          <div class="kit-top"><div class="kit-count">${ings.length}</div><div class="spacer"><b>in your kitchen</b><p class="small muted">${ings.length ? 'Keep it current for better ideas.' : 'Add what you have to get started.'}</p></div>
            <button class="icon-btn add-ic" type="button" data-add aria-label="Add ingredients" title="Add ingredients">${ICON.plus}</button></div>
          ${preview.length ? `<div class="kit-preview">${preview.map(i => `<span class="chip">${esc(i.name)}</span>`).join('')}${ings.length > 6 ? `<a class="chip" href="#/kitchen" style="text-decoration:none">+${ings.length - 6} more</a>` : ''}</div>` : `<button class="btn block" type="button" data-pack0>+ Add everyday basics (10 items)</button>`}
        </section>
      </div>
      <section id="results" aria-live="polite">${resultsHTML()}</section>
    </div></div>`;
  view().querySelectorAll('[data-slot]').forEach(b => b.addEventListener('click', () => { ui.slot = b.dataset.slot; view().querySelectorAll('[data-slot]').forEach(x => x.setAttribute('aria-pressed', x === b)); }));
  $('#go').addEventListener('click', suggest);
  view().querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', openAdd));
  const p0 = view().querySelector('[data-pack0]'); if (p0) p0.addEventListener('click', () => addPack(PACKS[0], () => { badges(); renderCook(); }));
  bindResults();
}
const STAGES = ['Reading your kitchen', 'Thinking of dishes you can make', 'Checking every ingredient against your kitchen'];
let stageTimers = [];
async function suggest(){
  if (ui.loading) return;
  ui.loading = true; ui.error = null; ui.result = null; ui.stage = 0; ui.alts = {}; ui.downOpen = null;
  if (location.hash.replace(/^#\/?/, '') !== '') { location.hash = '#/'; }
  route(true);
  stageTimers.forEach(clearTimeout);
  stageTimers = [setTimeout(() => setStage(1), 900), setTimeout(() => setStage(2), 5000), setTimeout(() => setStage(3), 14000)];
  if (innerWidth < 1100){ const r = $('#results'); if (r) r.scrollIntoView({behavior: reduce ? 'auto' : 'smooth', block: 'start'}); }
  const avoid = DB.suggestions().slice(0, 6).flatMap(s => s.meals.map(m => m.dish));
  try {
    const data = await AI.suggest({slot: ui.slot, avoid});
    const s = data.suggestion; ui.remaining = data.remaining_today;
    s.meals.forEach(m => { ui.alts[m.id] = m.alternatives || []; delete m.alternatives; });
    C.suggestions.unshift(s); ui.result = s;
  } catch(e){ ui.error = e.message || 'Something went wrong. Try again.'; }
  stageTimers.forEach(clearTimeout); ui.loading = false;
  if ((location.hash.replace(/^#\/?/, '') || '') === '') route(true);
  if (ui.remaining != null && ui.remaining <= 3) toast(ui.remaining ? `${ui.remaining} suggestion${ui.remaining === 1 ? '' : 's'} left today` : "That was today's last suggestion");
}
function setStage(n){ ui.stage = n; const r = $('#results'); if (r && ui.loading){ r.innerHTML = resultsHTML(); } }
function resultsHTML(){
  if (ui.loading){
    const n = DB.ingredients().length;
    return `<div class="card stack" style="gap:16px"><h2>Finding dishes for you</h2>
      <div class="progress">${STAGES.map((s, i) => { const st = ui.stage > i ? 'done' : ui.stage === i ? 'now' : ''; return `<div class="step ${st}"><span class="dot">${st === 'done' ? ICON.check : ''}</span>${i === 0 ? `Reading your ${n} ingredients` : s}</div>`; }).join('')}</div>
      <p class="small muted">${ui.stage >= 3 ? 'The AI is busy right now, so this is taking longer than usual. Hang on.' : 'Usually takes 5 to 15 seconds.'}</p>
      <div class="stack" style="gap:10px"><div class="skel" style="width:40%"></div><div class="skel" style="width:85%"></div><div class="skel" style="width:60%"></div></div></div>`;
  }
  if (ui.error) return `<div class="notice err"><b>That didn't work.</b><span>${esc(ui.error)}</span><div><button class="btn sm" data-retry>Try again</button></div></div>`;
  const r = ui.result;
  if (!r) return `<div class="placeholder">${ICON.bowl}<b style="color:var(--ink)">Your suggestion appears here</b><p class="small">Pick a meal and tap Suggest food.</p></div>`;
  let html = '';
  if (!r.possible){
    const missing = (r.nearest_missing || []).filter(Boolean);
    html += `<div class="notice warn"><b>${esc(r.reason || 'Not enough for a proper meal yet.')}</b>
      ${r.nearest_dish ? `<span>You're closest to <b>${esc(r.nearest_dish)}</b>${missing.length ? `, just missing ${missing.map(m => `<b>${esc(m)}</b>`).join(' and ')}` : ''}.</span>` : ''}
      ${r.unlock && !missing.includes(r.unlock) ? `<span>Adding <b>${esc(r.unlock)}</b> would unlock the most dishes.</span>` : ''}
      <div class="chips">${[...missing, ...(r.unlock && !missing.includes(r.unlock) ? [r.unlock] : [])].map(m => `<button class="btn sm solid" data-addretry="${esc(m)}">+ ${esc(m)}</button>`).join('')}
      ${missing.length > 1 ? `<button class="btn sm" data-addall="${esc(missing.join('|'))}">Add both and try again</button>` : ''}</div></div>`;
  }
  html += `<div class="results ${r.meals.length > 1 ? 'two' : ''}">${r.meals.map(mealHTML).join('')}</div>`;
  html += `<div class="stack" style="gap:8px; margin-top:14px"><button class="btn block" data-again>${ICON.shuffle} Suggest something different</button>${ui.remaining != null ? `<p class="remaining">${ui.remaining} suggestion${ui.remaining === 1 ? '' : 's'} left today</p>` : ''}</div>`;
  return html;
}
function mealHTML(m){
  const fav = DB.isFavourite(m.id), rate = DB.rating(m.id), alts = ui.alts[m.id] || [];
  return `<article class="meal" data-meal="${m.id}">
    <div class="meal-top"><span class="meal-ic ${m.slot}">${m.slot === 'breakfast' ? ICON.sun : ICON.bowl}</span>
      <div style="flex:1; min-width:0"><span class="slot">${esc(m.slot)}</span><h3>${esc(m.dish)}</h3><span class="mins">${ICON.clock}${esc(m.minutes)} min</span></div></div>
    <p class="why">${esc(m.why)}</p>
    <div class="stack" style="gap:6px"><span class="grounded">${ICON.check} Everything is in your kitchen</span><div class="chips">${m.uses.map(x => `<span class="chip use">${esc(x)}</span>`).join('')}</div></div>
    ${ui.downOpen === m.id ? `<div class="why-not"><b class="small">What was wrong?</b><div class="chips">${["I don't have something", "Don't like it", 'Takes too long', 'Had it recently'].map(x => `<button class="chip" data-reason="${esc(x)}">${esc(x)}</button>`).join('')}</div></div>` : ''}
    <div class="meal-actions">
      <button class="act heart" data-fav aria-pressed="${fav}" aria-label="${fav ? 'Saved. Tap to remove' : 'Save this dish'}" title="${fav ? 'Saved' : 'Save'}">${ICON.heart}</button>
      <button class="act" data-swap aria-label="${alts.length ? 'Show another dish' : 'Get a new idea'}" title="${alts.length ? 'Show another' : 'New idea'}">${ICON.shuffle}</button>
      <span class="spacer"></span>
      <button class="act up" data-up aria-pressed="${rate === 1}" aria-label="Good suggestion" title="Good suggestion">${ICON.up}</button>
      <button class="act down" data-down aria-pressed="${rate === -1}" aria-label="Not useful" title="Not useful">${ICON.down}</button>
    </div></article>`;
}
function bindResults(){
  const box = $('#results'); if (!box) return;
  const r = ui.result;
  const again = box.querySelector('[data-again]'); if (again) again.addEventListener('click', suggest);
  const retry = box.querySelector('[data-retry]'); if (retry) retry.addEventListener('click', suggest);
  box.querySelectorAll('[data-addretry]').forEach(b => b.addEventListener('click', () => { const n = b.dataset.addretry; DB.addIngredient(n, '', (ING_BY_NAME[n.toLowerCase()] || {}).default_unit); badges(); toast(`Added ${n}`); suggest(); }));
  box.querySelectorAll('[data-addall]').forEach(b => b.addEventListener('click', () => { b.dataset.addall.split('|').forEach(n => DB.addIngredient(n, '', (ING_BY_NAME[n.toLowerCase()] || {}).default_unit)); badges(); toast('Added'); suggest(); }));
  if (!r) return;
  box.querySelectorAll('[data-meal]').forEach(card => {
    const idx = r.meals.findIndex(m => m.id === card.dataset.meal); const m = r.meals[idx];
    const redraw = () => { card.outerHTML = mealHTML(r.meals[idx]); bindResults(); };
    card.querySelector('[data-fav]').addEventListener('click', () => { const on = DB.toggleFavourite(m); badges(); toast(on ? `Saved ${m.dish}` : `Removed ${m.dish} from saved`); redraw(); });
    card.querySelector('[data-up]').addEventListener('click', () => { const was = DB.rating(m.id); DB.rate(m, was === 1 ? 0 : 1); ui.downOpen = null; if (was !== 1) toast('Thanks. Noted.'); redraw(); });
    card.querySelector('[data-down]').addEventListener('click', () => { const was = DB.rating(m.id); if (was === -1){ DB.rate(m, 0); ui.downOpen = null; } else { DB.rate(m, -1); ui.downOpen = m.id; } redraw(); });
    card.querySelectorAll('[data-reason]').forEach(b => b.addEventListener('click', () => { DB.rate(m, -1, b.dataset.reason); ui.downOpen = null; toast('Thanks. That helps us improve.', ui.alts[m.id] && ui.alts[m.id].length ? {label: 'Show another', run: () => swap(idx)} : null); redraw(); }));
    card.querySelector('[data-swap]').addEventListener('click', () => swap(idx));
  });
}
async function swap(idx){
  const r = ui.result; const cur = r.meals[idx]; const alts = ui.alts[cur.id] || [];
  if (alts.length){
    const next = alts.shift(); const m = {id: uid(), slot: cur.slot, dish: next.dish, minutes: next.minutes, uses: next.uses, why: next.why};
    ui.alts[m.id] = [...alts, {dish: cur.dish, minutes: cur.minutes, uses: cur.uses, why: cur.why}].slice(0, 2);
    r.meals[idx] = m; DB.addMealVariant(r.id, m); ui.downOpen = null;
    const card = document.querySelector(`[data-meal="${cur.id}"]`); if (card){ card.outerHTML = mealHTML(m); bindResults(); }
    return;
  }
  const keep = ui.slot; ui.slot = cur.slot; await suggest(); ui.slot = keep;
}

/* =========================================================
   KITCHEN
   ========================================================= */
function renderKitchen(){
  const ings = DB.ingredients();
  view().innerHTML = `<div class="page">
    <header class="page-head"><div><h1>My kitchen</h1><p class="muted">${ings.length} ingredient${ings.length === 1 ? '' : 's'} · quantities are optional</p></div>
      <button class="btn leaf fab" type="button" data-add aria-label="Add ingredients" title="Add ingredients">${ICON.plus}<span class="fab-l">Add</span></button></header>
    ${ings.length ? `<div class="k-tools">
      <div class="search"><span class="s-ic">${ICON.search}</span><input class="input" id="k-q" type="search" placeholder="Find in your kitchen" value="${esc(ui.kitFilter)}" aria-label="Find in your kitchen" autocomplete="off"></div>
      <div class="hscroll" id="k-cats"></div></div><div id="k-list"></div>
      <div style="text-align:center; margin-top:22px" id="clear-zone"><button class="btn ghost" id="clear">Clear kitchen</button></div>`
    : `<div class="empty"><h2>Your kitchen is empty</h2><p>Add what you have. Every ingredient unlocks more dishes.</p><div class="chips" style="justify-content:center"><button class="btn leaf" data-add>${ICON.plus} Add ingredients</button><button class="btn" data-pack0>+ Everyday basics</button></div></div>`}
  </div>`;
  view().querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', openAdd));
  const p0 = view().querySelector('[data-pack0]'); if (p0) p0.addEventListener('click', () => addPack(PACKS[0], () => { badges(); renderKitchen(); }));
  if (!ings.length) return;
  const q = $('#k-q'); q.addEventListener('input', () => { ui.kitFilter = q.value; drawKitchen(); });
  $('#clear').addEventListener('click', () => { const all = DB.ingredients().slice(); DB.setIngredients([]); badges(); renderKitchen(); toast(`Cleared ${all.length} ingredients`, {run: () => { DB.setIngredients(all); badges(); renderKitchen(); }}); });
  drawKitchen();
}
function drawKitchen(){
  const ings = DB.ingredients(); const f = norm(ui.kitFilter);
  const cats = [...CATEGORIES, 'Others'].filter(c => ings.some(i => i.category === c));
  if (ui.kitCat !== 'All' && !cats.includes(ui.kitCat)) ui.kitCat = 'All';
  $('#k-cats').innerHTML = ['All', ...cats].map(c => `<button class="chip" aria-pressed="${ui.kitCat === c}" data-cat="${esc(c)}">${esc(c)} <span class="tiny" style="opacity:.7">${c === 'All' ? ings.length : ings.filter(i => i.category === c).length}</span></button>`).join('');
  $('#k-cats').querySelectorAll('[data-cat]').forEach(b => b.addEventListener('click', () => { ui.kitCat = b.dataset.cat; drawKitchen(); }));
  const shown = ings.filter(i => (ui.kitCat === 'All' || i.category === ui.kitCat) && (!f || norm(i.name).includes(f) || ((ING_BY_NAME[i.name.toLowerCase()] || {}).aliases || []).some(a => norm(a).includes(f))));
  const groups = cats.map(c => [c, shown.filter(i => i.category === c).sort((a, b) => a.name.localeCompare(b.name))]).filter(g => g[1].length);
  $('#k-list').innerHTML = groups.length ? groups.map(([c, items]) => `<div class="group-h"><span class="label">${esc(c)}</span><span class="small muted">${items.length}</span></div>
    <div class="rows">${items.map(i => { const meta = ING_BY_NAME[i.name.toLowerCase()]; const units = meta ? meta.allowed_units : CUSTOM_UNITS; return `<div class="irow" data-id="${i.id}">
      <span class="n">${esc(i.name)}${meta && meta.aliases[0] ? `<span class="a">${esc(meta.aliases[0])}</span>` : ''}</span>
      <span class="ctl"><span class="stepper"><button type="button" data-st="-1" aria-label="Less ${esc(i.name)}">−</button><input type="number" inputmode="decimal" min="0" step="any" value="${i.quantity ?? ''}" placeholder="Qty" aria-label="Quantity of ${esc(i.name)}" id="q-${i.id}"><button type="button" data-st="1" aria-label="More ${esc(i.name)}">+</button></span>
      <select class="unit-sel" aria-label="Unit for ${esc(i.name)}" id="u-${i.id}">${units.map(x => `<option ${x === i.unit ? 'selected' : ''}>${x}</option>`).join('')}</select></span>
      <button class="del" data-del aria-label="Remove ${esc(i.name)}">${ICON.trash}</button></div>`; }).join('')}</div>`).join('')
    : `<p class="muted" style="padding:20px 4px">Nothing matches “${esc(ui.kitFilter)}”. <button class="btn sm soft" data-add>Add it</button></p>`;
  $('#k-list').querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', openAdd));
  $('#k-list').querySelectorAll('.irow').forEach(row => {
    const id = row.dataset.id; const qi = row.querySelector('input'); const sel = row.querySelector('select');
    const step = u => ({g: 50, kg: .5, ml: 100, L: .5}[u] || 1);
    let t; const saveQ = () => { clearTimeout(t); t = setTimeout(() => DB.updateIngredient(id, {quantity: qi.value === '' ? null : Number(qi.value)}), 500); };
    row.querySelectorAll('[data-st]').forEach(b => b.addEventListener('click', () => { const v = Math.max(0, (Number(qi.value) || 0) + step(sel.value) * Number(b.dataset.st)); qi.value = v ? +v.toFixed(2) : ''; saveQ(); }));
    qi.addEventListener('input', saveQ);
    sel.addEventListener('change', () => DB.updateIngredient(id, {unit: sel.value}));
    row.querySelector('[data-del]').addEventListener('click', () => { const r = DB.removeIngredient(id); badges(); drawKitchen(); toast(`Removed ${r.name}`, {run: () => { DB.restoreIngredient(r); badges(); drawKitchen(); }}); });
  });
}

/* =========================================================
   SAVED
   ========================================================= */
function renderSaved(){
  const favs = DB.favourites(); const have = new Set(DB.ingredients().map(i => i.name.toLowerCase()));
  const withStatus = favs.map(f => ({f, miss: f.uses.filter(x => !have.has(String(x).toLowerCase()))}));
  const canNow = withStatus.filter(x => !x.miss.length).length;
  const shown = ui.savedFilter === 'now' ? withStatus.filter(x => !x.miss.length) : withStatus.slice().sort((a, b) => a.miss.length - b.miss.length);
  view().innerHTML = `<div class="page wide">
    <header class="page-head"><div><h1>Saved dishes</h1><p class="muted">${favs.length} saved · ${canNow} you can make now</p></div></header>
    ${favs.length ? `<div class="chips" style="margin-bottom:16px"><button class="chip" aria-pressed="${ui.savedFilter === 'all'}" data-f="all">All ${favs.length}</button><button class="chip" aria-pressed="${ui.savedFilter === 'now'}" data-f="now">Can make now ${canNow}</button></div>
    ${shown.length ? `<div class="fav-grid">${shown.map(({f, miss}) => `<article class="meal">
        <div class="meal-top"><span class="meal-ic ${f.slot}">${f.slot === 'breakfast' ? ICON.sun : ICON.bowl}</span><div style="flex:1; min-width:0"><span class="slot">${esc(f.slot)}</span><h3>${esc(f.dish)}</h3><span class="mins">${ICON.clock}${esc(f.minutes)} min</span></div></div>
        ${miss.length ? `<span class="status no">Missing ${esc(miss.join(', '))}</span>` : `<span class="status ok">${ICON.check} You can make this now</span>`}
        <div class="chips">${f.uses.map(x => `<span class="chip ${have.has(String(x).toLowerCase()) ? 'use' : 'miss'}">${esc(x)}</span>`).join('')}</div>
        <div class="meal-actions"><span class="small muted">Saved ${new Date(f.created_at).toLocaleDateString(undefined, {day: 'numeric', month: 'short'})}</span><span class="spacer"></span>
          ${miss.length ? `<button class="act" data-addmiss="${esc(miss.join('|'))}">${ICON.plus}Add missing</button>` : ''}
          <button class="act heart" aria-pressed="true" data-unfav="${f.id}" aria-label="Remove ${esc(f.dish)} from saved" title="Remove from saved">${ICON.heart}</button></div>
      </article>`).join('')}</div>` : `<div class="empty"><h2>Nothing you can make right now</h2><p>Your saved dishes each need something you don't have.</p><button class="btn" data-f="all">Show all saved</button></div>`}`
    : `<div class="empty">${ICON.heartNav}<h2>No saved dishes yet</h2><p>Tap <b>Save</b> on a suggestion you like. You'll see at a glance whether you can make it with what's in your kitchen.</p><a class="btn leaf" href="#/">Get a suggestion</a></div>`}
  </div>`;
  view().querySelectorAll('[data-f]').forEach(b => b.addEventListener('click', () => { ui.savedFilter = b.dataset.f; renderSaved(); }));
  view().querySelectorAll('[data-unfav]').forEach(b => b.addEventListener('click', () => { const f = DB.removeFavourite(b.dataset.unfav); badges(); renderSaved(); toast(`Removed ${f.dish}`, {run: () => { DB.restoreFavourite(f); badges(); renderSaved(); }}); }));
  view().querySelectorAll('[data-addmiss]').forEach(b => b.addEventListener('click', () => { const list = b.dataset.addmiss.split('|'); list.forEach(n => DB.addIngredient(n, '', (ING_BY_NAME[n.toLowerCase()] || {}).default_unit)); badges(); toast(`Added ${list.join(', ')} to your kitchen`); renderSaved(); }));
}

    sr.querySelectorAll('[data-st]').forEach(o => o.addEventListener('click', () => { const n = o.dataset.st; if (!u.staples.includes(n)) DB.updateProfile({staples: [...u.staples, n]}); toast(`${n} added to staples`); renderProfile(); })); });

/* =========================================================
   ROUTER
   ========================================================= */
let recovering = false;
function route(keepScroll){
  const r = location.hash.replace(/^#\/?/, '') || 'cook';
  if (recovering) return renderNewPassword();
  if (!DB.currentUser()) return r === 'signup' ? renderSignup() : renderLogin();
  if (r === 'login' || r === 'signup'){ location.hash = '#/'; return; }
  if (r === 'welcome') return renderWelcome();
  const page = {kitchen: 'kitchen', saved: 'saved', profile: 'profile', favourites: 'saved', settings: 'profile'}[r] || 'cook';
  shell(page);
  ({kitchen: renderKitchen, saved: renderSaved, profile: renderProfile}[page] || renderCook)();
  if (!keepScroll) window.scrollTo(0, 0);
}
window.addEventListener('hashchange', () => { closeAdd(); route(); });
(async function boot(){
  if (!sb){ $('#app').innerHTML = `<div class="auth"><div class="auth-box card stack"><h1>Start Rasoi first</h1><p>Open this page through the Rasoi server or its web address, not as a file.</p></div></div>`; return; }
  $('#app').innerHTML = `<div class="auth"><p class="muted">Loading your kitchen…</p></div>`;
  sb.auth.onAuthStateChange(event => { if (event === 'PASSWORD_RECOVERY'){ recovering = true; route(); } });
  try { const {data} = await sb.auth.getSession(); if (data.session) await DB.load(data.session); }
  catch(e){ console.error(e); toast("Couldn't load your data. Check your connection."); }
  if (DB.currentUser() && !DB.ingredients().length && !local.get('rasoi:onboarded:' + DB.currentUser().id, false) && !location.hash.includes('welcome')) location.hash = '#/welcome';
  route();
})();
</script>
